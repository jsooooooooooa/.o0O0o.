<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>.o0O0o. — songs</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;

            background: #ece4ce;

             overflow-x: hidden;
            overflow-y: auto;

            -webkit-text-size-adjust: 100%;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;

            padding:
                max(30px, env(safe-area-inset-top))
                max(24px, env(safe-area-inset-right))
                max(40px, env(safe-area-inset-bottom))
                max(24px, env(safe-area-inset-left));

            color: #2c1d15;
            font-family: serif;
        }

        button,
        input {
            font: inherit;
            color: inherit;
        }

        button {
            border: none;
            background: none;
            cursor: pointer;
        }

        main {
            width: 100%;
            max-width: 700px;
            min-width: 0;

            margin: 0 auto;
            padding-top: 12vh;
            text-align: center;
        }

        h1 {
            width: 66.6667%;
            max-width: 66.6667%;

            font-size: clamp(24px, 5vw, 52px);
            font-weight: 400;
            line-height: 1.1;
            letter-spacing: -0.08em;
            text-align: left;

            transform:scaleX(1.5);
            transform-origin:left center;
        }

        #add-button{
            display: block;

            width:50px;
            height:50px;

            margin:1px 0 0 auto;

            border:none;
            background:#ece4ce;

            cursor:pointer;
            -webkit-tap-highlight-color:transparent;

            clip-path:polygon(
                42% 0%,
                58% 0%,
                58% 42%,
                100% 42%,
                100% 58%,
                58% 58%,
                58% 100%,
                42% 100%,
                42% 58%,
                0% 58%,
                0% 42%,
                42% 42%
            );

            box-shadow:0 0 0 1.4px #2c1d15 inset;

            transition:
                background-color .18s ease,
                transform .15s ease;
        }

        #add-button:active{
            background:#2c1d15;

            transform:scale(.95);
        }

        #add-button:hover {
            background: #2c1d15;
            color: #ece4ce;
            transform: rotate(90deg);
        }

        @media (hover:hover){

            #add-button:hover{

                background:#2c1d15;

            }

        }

        #song-list {
            display: flex;
            flex-direction: column;
            gap: 28px;

            margin-top: 70px;
            padding-bottom: 80px;
        }

        .added-song {
            text-align: left;
            border-bottom: 1px solid rgba(44, 29, 21, 0.28);
            padding-bottom: 18px;

            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            touch-action: pan-y;

            transition:
                opacity 0.2s ease,
                transform 0.2s ease;

            position: relative;
            padding-right: 42px;

        }

        .added-song.pressing {
            opacity: 0.45;
            transform: scale(0.985);
        }

        .added-song-title {
            font-size: clamp(10px, 2vw, 17px);
            font-weight: 400;
            line-height: 1.3;
            line-height: 1.15;
        }

        #song-list,
        .added-song {
             width: 100%;
            min-width: 0;
        }

        .added-song-title,
        .added-song-artist {
            max-width: 100%;

            overflow-wrap: anywhere;
            word-break: break-word;
        }

        .added-song-artist {
            margin-top: 7px;
            font-size: clamp(7px, 1.3vw, 10px);
            opacity: 0.6;
        }

        .youtube-button {
            position: absolute;
            top: 40%;
            right: 4px;

            width: 28px;
            height: 28px;

            border: none;
            background: transparent;

            transform: translateY(-50%);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        /* 오른쪽을 향하는 테두리 삼각형 */
        .youtube-button::before {
            content: "";

            position: absolute;
            top: 50%;
            left: 50%;

            width: 14px;
            height: 16px;

            background: #2c1d15;

            transform: translate(-50%, -50%);

            clip-path: polygon(
                0 0,
                100% 50%,
                0 100%
            );
        }

        /* 안쪽을 미색으로 덮어서 테두리만 남김 */
        .youtube-button::after {
            content: "";

            position: absolute;
            top: 50%;
            left: 48%;

            width: 11px;
            height: 13px;

            background: #ece4ce;

            transform: translate(-50%, -50%);

            clip-path: polygon(
                0 0,
                100% 50%,
                0 100%
            );
        }

    .youtube-button:active::after {
        display: none;
    }

        /* 검색창을 덮는 화면 */
        #search-overlay {
            position: fixed;
            inset: 0;
            z-index: 100;

            display: flex;
            justify-content: center;
            align-items: flex-start;

            overflow-x: hidden;
            overflow-y: auto;

            -webkit-overflow-scrolling: touch;

            padding:
                max(30px, env(safe-area-inset-top))
                max(20px, env(safe-area-inset-right))
                max(30px, env(safe-area-inset-bottom))
                max(20px, env(safe-area-inset-left));

            background: rgba(236, 228, 206, 0.98);

            opacity: 0;
            visibility: hidden;
            pointer-events: none;

            transition:
                opacity 0.3s ease,
                visibility 0.3s ease;
        }

        #search-overlay.open {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .search-panel {
            width: 100%;
            max-width: 700px;
            min-height: calc(100vh + 1px);
            padding-top: 5vh;
            padding-bottom: 80px;
        }

        .search-header {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        #search-form {
            flex: 1;
            display: flex;
            align-items: center;

            border-bottom: 1px solid #2c1d15;
        }

        #search-input {
            width: 100%;
            padding: 14px 4px;

            border: none;
            outline: none;
            background: transparent;

            transform: translateY(-2px);

            font-size: clamp(14px, 2.5vw, 18px);
        }

        #search-input::placeholder {
            color: rgba(44, 29, 21, 0.45);
        }

        #close-button {
            flex-shrink: 0;
            width: 44px;
            height: 44px;

            font-size: 30px;
            font-weight: 300;
            line-height: 1;

            transform: translateY(-2px);
        }

        #search-message {
            min-height: 24px;
            margin-top: 24px;
            text-align: left;
            font-size: 14px;
            opacity: 0.65;
        }

        #search-results {
            display: flex;
            flex-direction: column;
            gap: 0;

            margin-top: 14px;
            padding-bottom: 80px;
        }

        .search-result {
            width: 100%;
            padding: 20px 4px;

            border-bottom: 1px solid rgba(44, 29, 21, 0.25);

            text-align: left;

            transition:
                padding-left 0.2s ease,
                opacity 0.2s ease;
        }

        .search-result:hover {
            padding-left: 10px;
        }

        .result-title {
            display: block;
            font-size: clamp(18px, 3.5vw, 24px);
            line-height: 1.4;
        }

        .result-artist {
            display: block;
            margin-top: 6px;
            font-size: 14px;
            opacity: 0.6;
        }

        @media (max-width: 600px) {
            main {
                padding-top: 9vh;
            }

            #search-input {
                font-size: 16px;
            }

            #add-button {
                width: 42px;
                height: 42px;

                margin: -10px 0 0 auto;
            }
            
            .added-song-title {
                margin-bottom: -1px;
                font-size: clamp(12px, 3.2vw, 18px);
            }

            .added-song-artist {
                margin: 3px 0 0 0;
            }

            .youtube-button {
                width: 18px;
                height: 18px;
                top: 37%;
            }

            .youtube-button::before {
                width: 10px;
                height: 12px;
            }

            .youtube-button::after {
                width: 8.5px;
                height: 10px;
            }

            #song-list {
                margin-top: 70px;
            }

            .search-panel {
                padding-top: 2vh;
            }
        }
    </style>
</head>

<body>

    <main>
        <h1>
            Leave a song<br>
            behind 
        </h1>

        <button
            id="add-button"
            type="button"
            aria-label="노래 검색창 열기"
        ></button>

        <section
            id="song-list"
            aria-live="polite"
        ></section>
    </main>


    <!-- 노래 검색 화면 -->
    <div
        id="search-overlay"
        aria-hidden="true"
    >
        <div class="search-panel">

            <div class="search-header">

                <form id="search-form">
                    <input
                        id="search-input"
                        type="search"
                        placeholder="Search songs & artists"
                        autocomplete="off"
                        enterkeyhint="search"
                    >
                   
                </form>

                <button
                    id="close-button"
                    type="button"
                    aria-label="검색창 닫기"
                >
                    ×
                </button>

            </div>

            <p id="search-message"></p>

            <section id="search-results"></section>

        </div>
    </div>


   <script type="module">
    import {
        initializeApp
    } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";

    import {
        getFirestore,
        collection,
        addDoc,
        onSnapshot,
        query,
        orderBy,
        serverTimestamp,
        deleteDoc,
        doc
    } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";


    /*
        YouTube API 키
    */
    const YOUTUBE_API_KEY = "AIzaSyCrUlVvF0FVlSxrWBgBLI3eLsXDO6uhW4E";


    /*
        새로 만든 Firebase 프로젝트 설정값을
        아래에 그대로 넣어주세요.
    */
    const firebaseConfig = {
        apiKey: "AIzaSyBBf9hjz8R1Q3yY8cWmha4jtFvQEJNAMUc",
        authDomain: "o0o0o-598ab.firebaseapp.com",
        projectId: "o0o0o-598ab",
        storageBucket: "o0o0o-598ab.firebasestorage.app",
        messagingSenderId: "786913857298",
        appId: "1:786913857298:web:a22bea10b56d8621672dcb"
    };


    /*
        Firebase / Firestore 시작
    */
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const songsCollection = collection(db, "songs");


    /*
        HTML 요소
    */
    const addButton = document.getElementById("add-button");
    const overlay = document.getElementById("search-overlay");
    const closeButton = document.getElementById("close-button");

    const searchForm = document.getElementById("search-form");
    const searchInput = document.getElementById("search-input");
    const searchResults = document.getElementById("search-results");
    const searchMessage = document.getElementById("search-message");

    const songList = document.getElementById("song-list");


    /*
        현재 Firestore에서 받아온 노래 목록
    */
    let savedSongs = [];


    function openSearch() {
        overlay.classList.add("open");
        overlay.setAttribute("aria-hidden", "false");

        document.body.style.overflow = "hidden";

        setTimeout(() => {
            searchInput.focus();
        }, 150);
    }


    function closeSearch() {
        overlay.classList.remove("open");
        overlay.setAttribute("aria-hidden", "true");

        document.body.style.overflow = "";

        searchInput.value = "";
        searchResults.innerHTML = "";
        searchMessage.textContent = "";
    }


    function decodeHtml(text) {
        const textarea = document.createElement("textarea");
        textarea.innerHTML = text;
        return textarea.value;
    }


    function cleanArtistName(channelTitle) {
        return channelTitle
            .replace(/\s*-\s*Topic$/i, "")
            .replace(/\s*VEVO$/i, "")
            .trim();
    }


    function cleanSongTitle(videoTitle) {
        return videoTitle
            .replace(/\s*\(Official\s*(Music\s*)?Video\)/gi, "")
            .replace(/\s*\[Official\s*(Music\s*)?Video\]/gi, "")
            .replace(/\s*\(Official\s*Audio\)/gi, "")
            .replace(/\s*\[Official\s*Audio\]/gi, "")
            .replace(/\s*\(Lyrics?\)/gi, "")
            .replace(/\s*\[Lyrics?\]/gi, "")
            .replace(/\s*\|\s*Official.*$/gi, "")
            .trim();
    }


    /*
        Firestore에서 받아온 노래를 화면에 표시
    */
    function renderSavedSongs() {
        songList.innerHTML = "";

        savedSongs.forEach((song) => {
            const article = document.createElement("article");
            article.className = "added-song";

            /*
                나중에 삭제할 때 사용할 Firestore 문서 ID
            */
            article.dataset.documentId = song.documentId;

            const title = document.createElement("h2");
            title.className = "added-song-title";
            title.textContent = song.title;

            const artist = document.createElement("p");
            artist.className = "added-song-artist";
            artist.textContent = song.artist;

            const youtubeButton = document.createElement("button");

            youtubeButton.type = "button";
            youtubeButton.className = "youtube-button";
            youtubeButton.setAttribute(
                "aria-label",
                `${song.title} 유튜브에서 열기`
            );

            youtubeButton.addEventListener("click", (event) => {
                event.stopPropagation();

                const youtubeUrl =
                    `https://www.youtube.com/watch?v=${song.videoId}`;

                window.open(
                    youtubeUrl,
                    "_blank",
                    "noopener,noreferrer"
                );
            });

            article.append(title, artist, youtubeButton);

            /*
            노래를 0.7초 동안 길게 누르면 삭제
            */
            let pressTimer = null;
            let startX = 0;
            let startY = 0;
            let longPressTriggered = false;

            function cancelLongPress() {
                clearTimeout(pressTimer);
                pressTimer = null;
                article.classList.remove("pressing");
            }

            article.addEventListener("pointerdown", (event) => {
                startX = event.clientX;
                startY = event.clientY;
                longPressTriggered = false;

                article.classList.add("pressing");

                pressTimer = setTimeout(() => {
                    longPressTriggered = true;
                    article.classList.remove("pressing");
                    deleteSong(song.documentId);
                }, 450);
            });

            article.addEventListener("pointermove", (event) => {
            const movedX = Math.abs(event.clientX - startX);
            const movedY = Math.abs(event.clientY - startY);

            if (movedX > 10 || movedY > 10) {
                cancelLongPress();
            }
        });

        article.addEventListener("pointerup", cancelLongPress);
        article.addEventListener("pointercancel", cancelLongPress);
        article.addEventListener("pointerleave", cancelLongPress);

        article.addEventListener("contextmenu", (event) => {
            event.preventDefault();
        });

        songList.appendChild(article);
        });
    }


    /*
        노래를 Firestore에 저장
    */
    async function saveSong(song) {
        const alreadyExists = savedSongs.some((savedSong) => {
            return savedSong.videoId === song.videoId;
        });

        if (alreadyExists) {
            searchMessage.textContent = "이미 추가된 노래입니다.";
            return;
        }

        searchMessage.textContent = "추가 중...";

        try {
            await addDoc(songsCollection, {
                title: song.title,
                artist: song.artist,
                videoId: song.videoId,
                createdAt: serverTimestamp()
            });

            closeSearch();

        } catch (error) {
            console.error("노래 저장 오류:", error);

            searchMessage.textContent =
                "노래를 저장하지 못했습니다. Firestore 설정을 확인해주세요.";
        }
    }
    /*
    Firestore에서 노래 삭제
    */
    async function deleteSong(documentId) {
        const shouldDelete = window.confirm(
            "Delete?"
        );

        if (!shouldDelete) {
            return;
        }

        try {
            await deleteDoc(
                doc(db, "songs", documentId)
            );

        } catch (error) {
            console.error("노래 삭제 오류:", error);

        window.alert(
                "노래를 삭제하지 못했습니다."
            );
        }
    }


    function renderSearchResults(items) {
        searchResults.innerHTML = "";

        if (!items.length) {
            searchMessage.textContent = "No search results found.";
            return;
        }

        searchMessage.textContent = "Select a song to add";

        items.forEach((item) => {
            const rawTitle = decodeHtml(item.snippet.title);
            const rawArtist = decodeHtml(item.snippet.channelTitle);

            const song = {
                title: cleanSongTitle(rawTitle),
                artist: cleanArtistName(rawArtist),
                videoId: item.id.videoId
            };

            const button = document.createElement("button");
            button.type = "button";
            button.className = "search-result";

            const title = document.createElement("span");
            title.className = "result-title";
            title.textContent = song.title;

            const artist = document.createElement("span");
            artist.className = "result-artist";
            artist.textContent = song.artist;

            button.append(title, artist);

            button.addEventListener("click", () => {
                saveSong(song);
            });

            searchResults.appendChild(button);
        });
    }


    async function searchYouTube(queryText) {
       if (
            !YOUTUBE_API_KEY ||
            YOUTUBE_API_KEY === "네 YouTube API 키, 건드리지 말 것"
        ) {
            searchMessage.textContent =
                "YouTube API 키를 입력해주세요.건드리지 말 것";
            return;
            }

        searchMessage.textContent = "검색 중...";
        searchResults.innerHTML = "";

        const parameters = new URLSearchParams({
            part: "snippet",
            type: "video",
            maxResults: "10",
            q: queryText,
            videoCategoryId: "10",
            key: YOUTUBE_API_KEY
        });

        const requestUrl =
            "https://www.googleapis.com/youtube/v3/search?" +
            parameters.toString();

        try {
            const response = await fetch(requestUrl);
            const data = await response.json();

            if (!response.ok) {
                console.error(data);

                const apiMessage =
                    data.error?.message ||
                    "YouTube 검색 중 오류가 발생했습니다.";

                throw new Error(apiMessage);
            }

            renderSearchResults(data.items || []);

        } catch (error) {
            console.error(error);

            searchMessage.textContent =
                "검색하지 못했습니다. API 키 설정을 확인해주세요.";
        }
    }


    /*
        Firestore의 songs 컬렉션을 실시간으로 감시

        createdAt이 최신인 노래부터 표시
    */
    const songsQuery = query(songsCollection);

    onSnapshot(
        songsQuery,

        (snapshot) => {
            savedSongs = snapshot.docs.map((songDocument) => {
                return {
                    documentId: songDocument.id,
                    ...songDocument.data()
                };
            });

            renderSavedSongs();
        },

        (error) => {
            console.error("노래 목록 불러오기 오류:", error);

            songList.innerHTML = `
                <p style="opacity: 0.6;">
                    노래 목록을 불러오지 못했습니다.
                </p>
            `;
        }
    );


    addButton.addEventListener("click", openSearch);
    closeButton.addEventListener("click", closeSearch);


    overlay.addEventListener("click", (event) => {
        if (event.target === overlay) {
            closeSearch();
        }
    });


    document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
            closeSearch();
        }
    });


    searchForm.addEventListener("submit", (event) => {
        event.preventDefault();

        const queryText = searchInput.value.trim();

        if (!queryText) {
            searchMessage.textContent =
                "노래 제목이나 가수를 입력해주세요.";
            return;
        }

        searchYouTube(queryText);
    });
</script>

</body>
</html>
