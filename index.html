<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>.o0O0o.</title>

    <style>

        :root {

            /* Background */
            --bg: #D8D3C8;
            --bg-transparent: rgba(216, 211, 200, 0.98);

            
            /* Text */
            --text: #342A22;


            /* Lines */
            --line: #342A22;

            --line-soft: rgba(52, 42, 34, 0.28);
            --line-faint: rgba(52, 42, 34, 0.25);
            --text-muted: rgba(52, 42, 34, 0.6);
            --placeholder: rgba(52, 42, 34, 0.45);


            /* Hover */
            --hover: rgba(52,42,34,.08);

        }

        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg);
        }

        #scene {
            position: relative;

            width: 100vw;
            height: 100vh;
            height: 100dvh;

            overflow: hidden;
            background: var(--bg);
        }

        #ball {
            position: absolute;
            z-index: 2;

            left: 50%;
            top: 50%;

            width: 90px;
            height: 90px;

            margin-left: -45px;
            margin-top: -45px;

            border-radius: 50%;
            background: var(--bg);

            transform: translateY(-100vh);
            transform-origin: center center;

            will-change: transform;
        }

        #ripples {
            position: absolute;
            z-index: 1;

            left: 50%;
            top: 50%;

            width: 1px;
            height: 1px;

            pointer-events: none;
        }

        .ripple {
            position: absolute;

            left: 50%;
            top: 50%;

            width: 90px;
            height: 90px;

            margin-left: -45px;
            margin-top: -45px;

            border: 2px solid var(--bg);
            border-radius: 50%;

            opacity: 0;
            transform: scale(1);
            transform-origin: center center;

            will-change: transform, opacity;
        }
    </style>
</head>

<body>

    <main id="scene">

        <div id="ripples">
            <div class="ripple"></div>
            <div class="ripple"></div>
            <div class="ripple"></div>
        </div>

        <div id="ball"></div>

    </main>

    <script>
        const ball = document.querySelector("#ball");
        const ripples = document.querySelectorAll(".ripple");

        let y = -window.innerHeight * 0.7;
        let velocity = 0;

        const gravity = 2200;
        const bounceStrength = 0.48;

        let previousTime = null;
        let bounceCount = 0;
        let squash = 0;

        let finished = false;
        let rippleStarted = false;
        let ballExpansionStarted = false;

        function expandBall() {
            if (ballExpansionStarted) return;

            ballExpansionStarted = true;

            const diagonal = Math.hypot(
                window.innerWidth,
                window.innerHeight
            );

            const requiredScale = diagonal / 90 + 0.5;

            ball.animate(
                [
                    {
                        transform: "translateY(0) scale(1)"
                    },
                    {
                        transform:
                            `translateY(0) scale(${requiredScale})`
                    }
                ],
                {
                    duration: 1200,
                    easing: "cubic-bezier(0.76, 0, 0.24, 1)",
                    fill: "forwards"
                }
            );

            /*
                원이 화면을 완전히 덮은 뒤
                척추 페이지로 이동
            */
            setTimeout(() => {
                window.location.href = "spine.html";
            }, 1200);
        }

        function startRipples() {
            ripples.forEach((ripple, index) => {
                const rippleDelay = index * 220;

                ripple.animate(
                    [
                        {
                            transform: "scale(1)",
                            opacity: 0
                        },
                        {
                            transform: "scale(1.05)",
                            opacity: 0.75,
                            offset: 0.08
                        },
                        {
                            transform: "scale(7)",
                            opacity: 0
                        }
                    ],
                    {
                        duration: 1800,
                        delay: rippleDelay,
                        easing: "cubic-bezier(0.16, 1, 0.3, 1)",
                        fill: "forwards"
                    }
                );

                /*
                    세 번째 동심원이 시작되는 순간
                    가운데 원도 동시에 확장
                */
                if (index === 2) {
                    setTimeout(() => {
                        expandBall();
                    }, rippleDelay);
                }
            });
        }

        function beginRippleSequence() {
            if (rippleStarted) return;

            rippleStarted = true;

            if ("vibrate" in navigator) {
                navigator.vibrate(80);
            }

            /*
                별도의 대기 시간 없이
                공이 멈추는 즉시 동심원 시작
            */
            startRipples();
        }

        function animate(currentTime) {
            if (previousTime === null) {
                previousTime = currentTime;
            }

            const deltaTime = Math.min(
                (currentTime - previousTime) / 1000,
                0.03
            );

            previousTime = currentTime;

            if (!finished) {
                velocity += gravity * deltaTime;
                y += velocity * deltaTime;

                if (y >= 0) {
                    y = 0;

                    const impactSpeed = Math.abs(velocity);

                    velocity = -impactSpeed * bounceStrength;
                    bounceCount++;

                    squash = Math.min(
                        0.18,
                        impactSpeed / 7000
                    );

                    if (
                        bounceCount >= 5 ||
                        Math.abs(velocity) < 85
                    ) {
                        y = 0;
                        velocity = 0;
                        finished = true;

                        beginRippleSequence();
                    }
                }
            }

            squash *= Math.pow(0.002, deltaTime);

            const scaleX = 1 + squash;
            const scaleY = 1 - squash * 0.72;

            if (!ballExpansionStarted) {
                ball.style.transform =
                    `translateY(${y}px) scale(${scaleX}, ${scaleY})`;
            }

            requestAnimationFrame(animate);
        }

        requestAnimationFrame(animate);
    </script>

</body>
</html>
