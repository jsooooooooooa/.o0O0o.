<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>.o0O0o. — spine</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            width: 100%;
            min-height: 100%;

            background: #ece4ce;
            scroll-behavior: auto;
        }

        body {
            width: 100%;
            min-height: 100%;

            overflow-x: hidden;
            overflow-y: auto;

            background: #ece4ce;

            -webkit-overflow-scrolling: touch;
        }

        #spine-page {
            position: relative;

            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;

            display: flex;
            flex-direction: column;
            align-items: center;

            background: #ece4ce;
        }

        /*
            페이지 가장 위쪽 여백
        */
        .top-space {
            width: 100%;

            height: 40vh;
            height: 40dvh;

            flex-shrink: 0;
        }

        /*
            클릭 가능한 뇌 이미지 영역
        */
        #brain-link {
            display: block;

            width: fit-content;
            max-width: 90vw;

            cursor: pointer;

            text-decoration: none;

            -webkit-tap-highlight-color: transparent;
           
            transform: translateX(2px);
        }

        #brain-image {
            display: block;

            width: auto;
            height: auto;

            max-width: min(65vw, 650px);

            object-fit: contain;

            user-select: none;
            -webkit-user-select: none;
            -webkit-user-drag: none;

            transition:
                transform 0.8s cubic-bezier(0.16, 1, 0.3, 1),
                opacity 0.8s ease;

            transform: scale(1);
        }

        /*
            마우스를 올리면 뇌가 아주 살짝 커짐
        */
        #brain-link:hover #brain-image {
            transform: scale(1.025);
        }

        /*
            클릭할 때 살짝 작아지는 효과
        */
        #brain-link:active #brain-image {
            transform: scale(0.985);
        }

        /*
            뇌와 척추 사이 간격
        */
        .brain-spine-space {
            width: 100%;

            height: -10vh;
            margin-bottom: -10svh;

            flex-shrink: 0;
        }

        #spine-image {
            display: block;

            width: auto;
            height: auto;

            max-width: min(90vw, 900px);

            object-fit: contain;

            opacity: 0;

            /*
                정중앙부터 위아래로 퍼지는 마스크
            */
            -webkit-mask-image:
                linear-gradient(
                    to bottom,
                    transparent 0%,
                    rgba(0, 0, 0, 0.15) 14%,
                    black 38%,
                    black 62%,
                    rgba(0, 0, 0, 0.15) 86%,
                    transparent 100%
                );

            mask-image:
                linear-gradient(
                    to bottom,
                    transparent 0%,
                    rgba(0, 0, 0, 0.15) 14%,
                    black 38%,
                    black 62%,
                    rgba(0, 0, 0, 0.15) 86%,
                    transparent 100%
                );

            -webkit-mask-size: 100% 2%;
            mask-size: 100% 2%;

            -webkit-mask-position: center;
            mask-position: center;

            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;

            transform: scale(0.99);

            user-select: none;
            -webkit-user-select: none;
            -webkit-user-drag: none;

            will-change:
                opacity,
                transform,
                -webkit-mask-size,
                mask-size;
        }

        /*
            척추 아래쪽으로도 스크롤 가능하게 하는 여백
        */
        .bottom-space {
            width: 100%;

            height: 55vh;
            height: 55dvh;

            flex-shrink: 0;
        }

        @media (max-width: 700px) {
            #brain-image {
                max-width: 82vw;
            }

            .top-space {
                height: 30vh;
                height: 30dvh;
            }

            .brain-spine-space {
                height: -16vh;
                height: -16dvh;
            }

            .bottom-space {
                height: 52vh;
                height: 52dvh;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            #spine-image {
                opacity: 1;
                transform: none;

                -webkit-mask-image: none;
                mask-image: none;
            }

            #brain-image {
                transition: none;
            }
        }
    </style>
</head>

<body>

    <main id="spine-page">

        <div
            class="top-space"
            aria-hidden="true"
        ></div>

        <!--
            뇌 이미지를 클릭하면 songs.html로 이동
        -->
        <a
            id="brain-link"
            href="songs.html"
            aria-label="좋아하는 노래를 남기는 페이지로 이동"
        >
            <img
                id="brain-image"
                src="images/brain.png"
                alt="뇌 드로잉"
                draggable="false"
            >
        </a>

        <div
            class="brain-spine-space"
            aria-hidden="true"
        ></div>

        <img
            id="spine-image"
            src="images/spine.png"
            alt="척추 드로잉"
            draggable="false"
        >

        <div
            class="bottom-space"
            aria-hidden="true"
        ></div>

    </main>

    <script>
        const spineImage =
            document.querySelector("#spine-image");

        const brainImage =
            document.querySelector("#brain-image");

        let revealAnimation = null;

        /*
            새로고침하거나 뒤로 왔을 때
            이전 스크롤 위치가 자동 복원되지 않게 함
        */
        if ("scrollRestoration" in history) {
            history.scrollRestoration = "manual";
        }

        /*
            척추 이미지의 정중앙을
            화면 정중앙에 맞춤
        */
        function centerSpineImage() {
            const imageCenter =
                spineImage.offsetTop +
                spineImage.offsetHeight / 2;

            const targetScroll =
                imageCenter -
                window.innerHeight / 2;

            window.scrollTo({
                top: Math.max(0, targetScroll),
                left: 0,
                behavior: "auto"
            });
        }

       /*
        등장 애니메이션이 끝난 뒤
        남아 있는 위아래 마스크를 제거
       */
       function finishReveal() {
            spineImage.style.opacity = "1";
            spineImage.style.transform = "scale(1)";

        if (revealAnimation) {
            revealAnimation.cancel();
            revealAnimation = null;
            }

        }

        /*
            척추 정중앙에서 위아래로 퍼지며 등장
        */
        function revealSpineImage() {
            centerSpineImage();

            requestAnimationFrame(() => {
                requestAnimationFrame(() => {

                    revealAnimation = spineImage.animate(
                        [
                            {
                                opacity: 0,
                                transform: "scale(0.99)",

                                webkitMaskSize: "100% 2%",
                                maskSize: "100% 2%"
                            },
                            {
                                opacity: 0.2,
                                transform: "scale(0.992)",

                                webkitMaskSize: "100% 20%",
                                maskSize: "100% 20%",

                                offset: 0.16
                            },
                            {
                                opacity: 0.72,
                                transform: "scale(0.998)",

                                webkitMaskSize: "100% 115%",
                                maskSize: "100% 115%",

                                offset: 0.65
                            },
                            {
                                opacity: 1,
                                transform: "scale(1)",

                                webkitMaskSize: "100% 220%",
                                maskSize: "100% 220%"
                            }
                        ],
                        {
                            duration: 4200,

                            easing:
                                "cubic-bezier(0.16, 1, 0.3, 1)",

                            fill: "forwards"
                        }
                    );

                    revealAnimation = spineImage.animate(
                        [
                            {
                            opacity: 0,
                            transform: "scale(0.99)",
                            webkitMaskSize: "100% 2%",
                            maskSize: "100% 2%"
                            },
                            {
                            opacity: 0.2,
                            transform: "scale(0.992)",
                            webkitMaskSize: "100% 20%",
                            maskSize: "100% 20%",
                            offset: 0.16
                            },
                            {
                            opacity: 0.72,
                            transform: "scale(0.998)",
                            webkitMaskSize: "100% 115%",
                            maskSize: "100% 115%",
                            offset: 0.65
                            },
                            {
                            opacity: 1,
                            transform: "scale(1)",
                            webkitMaskSize: "100% 220%",
                            maskSize: "100% 220%"
                            }
                        ],
                        {
                        duration: 4200,
                        easing: "cubic-bezier(0.16, 1, 0.3, 1)",
                        fill: "forwards"
                        }
                    );

                    /* 여기부터 추가 */
                    setTimeout(() => {
                        spineImage.style.webkitMaskImage = "none";
                        spineImage.style.maskImage = "none";
                    }, 1000);

                    revealAnimation.addEventListener(
                        "finish",
                        finishReveal,
                        { once: true }
                    );

                });
            });
        }

        /*
            척추 이미지가 완전히 로딩된 후
            위치 계산과 등장 애니메이션 실행
        */
        if (spineImage.complete) {
            revealSpineImage();
        } else {
            spineImage.addEventListener(
                "load",
                revealSpineImage,
                { once: true }
            );
        }

        spineImage.addEventListener(
            "error",
            () => {
                console.error(
                    "images/spine.png 파일을 불러오지 못했습니다."
                );
            },
            { once: true }
        );

        brainImage.addEventListener(
            "error",
            () => {
                console.error(
                    "images/brain.png 파일을 불러오지 못했습니다."
                );
            },
            { once: true }
        );

        /*
            화면 크기가 달라지면
            척추 중앙을 다시 맞춤
        */
        window.addEventListener("resize", () => {
            centerSpineImage();
        });
    </script>

</body>
</html>
