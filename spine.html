<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>.o0O0o. — spine</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            width: 100%;
            min-height: 100%;

            background: #ece4ce;
            scroll-behavior: auto;
        }

        body {
            width: 100%;
            min-height: 100%;

            overflow-x: hidden;
            overflow-y: auto;

            background: #ece4ce;

            -webkit-overflow-scrolling: touch;
        }

        #spine-page {
            position: relative;

            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;

            display: flex;
            flex-direction: column;
            align-items: center;

            background: #ece4ce;
        }

        /*
            페이지 가장 위쪽 여백
        */
        .top-space {
            width: 100%;

            height: 40vh;
            height: 40dvh;

            flex-shrink: 0;
        }

        /*
            클릭 가능한 뇌 이미지 영역
        */
        #brain-link {
            display: block;

            width: fit-content;
            max-width: 90vw;

            cursor: pointer;

            text-decoration: none;

            -webkit-tap-highlight-color: transparent;
           
            transform: translateX(5px);
        }

        #brain-image {
            display: block;

            width: auto;
            height: auto;

            max-width: min(65vw, 650px);

            object-fit: contain;

            user-select: none;
            -webkit-user-select: none;
            -webkit-user-drag: none;

            transition:
                transform 0.8s cubic-bezier(0.16, 1, 0.3, 1),
                opacity 0.8s ease;

            transform: scale(1);
        }

        /*
            마우스를 올리면 뇌가 아주 살짝 커짐
        */
        #brain-link:hover #brain-image {
            transform: scale(1.025);
        }

        /*
            클릭할 때 살짝 작아지는 효과
        */
        #brain-link:active #brain-image {
            transform: scale(0.985);
        }

        /*
            뇌와 척추 사이 간격
        */
        .brain-spine-space {
            width: 100%;

            height: 0;
            margin-bottom: -5dvh;

            flex-shrink: 0;
        }

        #spine-image {
            display: block;

            width: auto;
            height: auto;

            max-width: min(90vw, 900px);

            object-fit: contain;

            opacity: 0;

            /*
                정중앙부터 위아래로 퍼지는 마스크
            */
            -webkit-mask-image:
                linear-gradient(
                    to bottom,
                    transparent 0%,
                    rgba(0, 0, 0, 0.15) 14%,
                    black 38%,
                    black 62%,
                    rgba(0, 0, 0, 0.15) 86%,
                    transparent 100%
                );

            mask-image:
                linear-gradient(
                    to bottom,
                    transparent 0%,
                    rgba(0, 0, 0, 0.15) 14%,
                    black 38%,
                    black 62%,
                    rgba(0, 0, 0, 0.15) 86%,
                    transparent 100%
                );

            -webkit-mask-size: 100% 2%;
            mask-size: 100% 2%;

            -webkit-mask-position: center;
            mask-position: center;

            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;

            transform: scale(0.99);

            user-select: none;
            -webkit-user-select: none;
            -webkit-user-drag: none;

            will-change:
                opacity,
                transform,
                -webkit-mask-size,
                mask-size;
        }

        /*
            척추 아래쪽으로도 스크롤 가능하게 하는 여백
        */
        .bottom-space {
            width: 100%;

            height: 55vh;
            height: 55dvh;

            flex-shrink: 0;
        }

        @media (max-width: 700px) {
            #brain-image {
                max-width: 82vw;
            }

            .top-space {
                height: 30vh;
                height: 30dvh;
            }

            .brain-spine-space {
                height: 0;
                margin-bottom: -10dvh;
            }

            .bottom-space {
                height: 52vh;
                height: 52dvh;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            #spine-image {
                opacity: 1;
                transform: none;

                -webkit-mask-image: none;
                mask-image: none;
            }

            #brain-image {
                transition: none;
            }
        }

        #drawings {
            position: relative;

            width: 100%;
            max-width: 900px;
            min-height: 100vh;

            margin: 0 auto;
            overflow: hidden;
        }

        .drawing {
            position: absolute;
            display: block;

            width: auto;
            height: auto;

            object-fit: contain;

            user-select: none;
            -webkit-user-select: none;
            -webkit-user-drag: none;

            opacity: 0;
            transform-origin: center;

            transition:
                opacity 0.7s ease,
                transform 0.3s ease;
        }

        .drawing.visible {
            opacity: 1;
        }

        @media (hover: hover) {
            .drawing:hover {
                z-index: 10;
                transform: scale(1.025) !important;
            }
        }
    </style>
</head>

<body>

    <main id="spine-page">

        <div
            class="top-space"
            aria-hidden="true"
        ></div>

        <!--
            뇌 이미지를 클릭하면 songs.html로 이동
        -->
        <a
            id="brain-link"
            href="songs.html"
            aria-label="좋아하는 노래를 남기는 페이지로 이동"
        >
            <img
                id="brain-image"
                src="images/brain.png"
                alt="뇌 드로잉"
                draggable="false"
            >
        </a>

        <div
            class="brain-spine-space"
            aria-hidden="true"
        ></div>

        <img
            id="spine-image"
            src="images/spine.png"
            alt="척추 드로잉"
            draggable="false"
        >

        <div
            class="bottom-space"
            aria-hidden="true"
        ></div>

        <section id="drawings"></section>

    </main>

    <script>
        const spineImage =
            document.querySelector("#spine-image");

        const brainImage =
            document.querySelector("#brain-image");

        let revealAnimation = null;

        /*
            새로고침하거나 뒤로 왔을 때
            이전 스크롤 위치가 자동 복원되지 않게 함
        */
        if ("scrollRestoration" in history) {
            history.scrollRestoration = "manual";
        }

        /*
            척추 이미지의 정중앙을
            화면 정중앙에 맞춤
        */
        function centerSpineImage() {
            const imageCenter =
                spineImage.offsetTop +
                spineImage.offsetHeight / 2;

            const targetScroll =
                imageCenter -
                window.innerHeight / 2;

            window.scrollTo({
                top: Math.max(0, targetScroll),
                left: 0,
                behavior: "auto"
            });
        }

       /*
        등장 애니메이션이 끝난 뒤
        남아 있는 위아래 마스크를 제거
       */
       function finishReveal() {
            spineImage.style.opacity = "1";
            spineImage.style.transform = "scale(1)";

        if (revealAnimation) {
            revealAnimation.cancel();
            revealAnimation = null;
            }

        }

        /*
            척추 정중앙에서 위아래로 퍼지며 등장
        */
        function revealSpineImage() {
            centerSpineImage();

            requestAnimationFrame(() => {
                requestAnimationFrame(() => {

                    revealAnimation = spineImage.animate(
                        [
                            {
                                opacity: 0,
                                transform: "scale(0.99)",

                                webkitMaskSize: "100% 2%",
                                maskSize: "100% 2%"
                            },
                            {
                                opacity: 0.2,
                                transform: "scale(0.992)",

                                webkitMaskSize: "100% 20%",
                                maskSize: "100% 20%",

                                offset: 0.16
                            },
                            {
                                opacity: 0.72,
                                transform: "scale(0.998)",

                                webkitMaskSize: "100% 115%",
                                maskSize: "100% 115%",

                                offset: 0.65
                            },
                            {
                                opacity: 1,
                                transform: "scale(1)",

                                webkitMaskSize: "100% 220%",
                                maskSize: "100% 220%"
                            }
                        ],
                        {
                            duration: 4200,

                            easing:
                                "cubic-bezier(0.16, 1, 0.3, 1)",

                            fill: "forwards"
                        }
                    );                   

                    /* 여기부터 추가 */
                    setTimeout(() => {
                        spineImage.style.webkitMaskImage = "none";
                        spineImage.style.maskImage = "none";
                    }, 1000);

                    revealAnimation.addEventListener(
                        "finish",
                        finishReveal,
                        { once: true }
                    );

                });
            });
        }

        /*
            척추 이미지가 완전히 로딩된 후
            위치 계산과 등장 애니메이션 실행
        */
        if (spineImage.complete) {
            revealSpineImage();
        } else {
            spineImage.addEventListener(
                "load",
                revealSpineImage,
                { once: true }
            );
        }

        spineImage.addEventListener(
            "error",
            () => {
                console.error(
                    "images/spine.png 파일을 불러오지 못했습니다."
                );
            },
            { once: true }
        );

        brainImage.addEventListener(
            "error",
            () => {
                console.error(
                    "images/brain.png 파일을 불러오지 못했습니다."
                );
            },
            { once: true }
        );



            /*
            드로잉 나열
            */
       const drawingsSection =
            document.getElementById("drawings");


        /*
        드로잉 이미지 70장
        파일 이름과 확장자는 실제 파일과 정확히 같아야 함
        */
        const drawingFiles = [
            "H01_바람.jpeg",
            "H02_물가.jpeg",
            "H03_나뭇잎.jpeg",
            "H04_비행기.jpeg",
            "H05_볼펜.jpeg",
            "H06_티비.jpeg",
            "H07_이젤.jpeg",
            "H08_선풍기.jpeg",
            "H09_향수.jpeg",
            "H10_얼음.jpeg",
            "H11_팝콘.jpeg",
            "H12_채점.jpeg",
            "H13_기타.jpeg",
            "H14_커터칼.jpeg",
            "H15_카메라.jpeg",
            "H16_가위질.jpeg",
            "H17_비닐.jpeg",
            "H18_초인종.jpeg",
            "H19_지퍼.jpeg",
            "H20_우산.jpeg",
            "H21_충전기.jpeg",
            "H22_집게.jpeg",
            "H23_서랍.jpeg",
            "H24_타자.jpeg",
            "H25_예원_무용.jpeg",
            "H26_버스.jpeg",
            "H27_눈.jpeg",
            "H28_시계.jpeg",

            "V01_파도.jpeg",
            "V02_자갈.jpeg",
            "V03_라이브_진동.jpeg",
            "V04_웃음.jpeg",
            "V05_구두.jpeg",
            "V06_공항.jpeg",
            "V07_맨발.jpeg",
            "V08_쿠션.jpeg",
            "V09_마우스.jpeg",
            "V10_소묘.jpeg",
            "V11_책.jpeg",
            "V12_학교종.jpeg",
            "V13_에어팟.jpeg",
            "V14_숨.jpeg",
            "V15_튜닝.jpeg",
            "V16_약.jpeg",
            "V17_영화관.jpeg",

            "V30_실기실.jpeg",
            "V31_에어드랍.jpeg",
            "V32_비행기_내부.jpeg",
            "V33_급식실.jpeg",
            "V34_반가운_목소리.jpeg",
            "V35_타지에서.jpeg",
            "V36_이불.jpeg",
            "V37_좋아하는.jpeg",
            "V38_지하철.jpeg",
            "V39_창문_바람.jpeg",
            "V40_파우치.jpeg",
            "V41_매미.jpeg",
            "V42_비.jpeg"
        ];


        /*
        새로고침해도 같은 랜덤 배치가 나오게 하는
        고정 랜덤 숫자 생성기
        */
        function createSeededRandom(seed) {
            let value = seed;

            return function random() {
                value |= 0;
                value = value + 0x6D2B79F5 | 0;

                let result = Math.imul(
                    value ^ value >>> 15,
                    1 | value
                );

            result =
                result +
                Math.imul(
                    result ^ result >>> 7,
                    61 | result
                ) ^
                result;

            return (
                (result ^ result >>> 14) >>> 0
            ) / 4294967296;
        };
    }


    function shuffleArray(array, random) {
        const copiedArray = [...array];

        for (
            let index = copiedArray.length - 1;
            index > 0;
            index--
        ) {
            const randomIndex =
                Math.floor(random() * (index + 1));

            [
                copiedArray[index],
                copiedArray[randomIndex]
            ] = [
                copiedArray[randomIndex],
                copiedArray[index]
            ];
        }

        return copiedArray;
    }


    function loadDrawing(fileName) {
        return new Promise((resolve) => {
            const image = new Image();

            image.className = "drawing";
            image.src =
                `images/drawings/${fileName}`;

            image.alt = fileName
                .replace(/\.[^.]+$/, "")
                .replace(/^[HV]\d+_?/, "")
                .replaceAll("_", " ");

            image.draggable = false;

            image.addEventListener(
                "load",
                () => {
                    resolve({
                        fileName,
                        image,
                        ratio:
                            image.naturalWidth /
                            image.naturalHeight
                    });
                },
                { once: true }
            );

            image.addEventListener(
                "error",
                () => {
                    console.error(
                        `이미지를 불러오지 못했습니다: ${fileName}`
                    );

                    resolve(null);
                },
                { once: true }
            );
        });
    }


    /*
    두 이미지가 서로 겹치는지 확인
    */
    function rectanglesOverlap(first, second, gap) {
        return !(
            first.x + first.width + gap <= second.x ||
            second.x + second.width + gap <= first.x ||
            first.y + first.height + gap <= second.y ||
            second.y + second.height + gap <= first.y
        );
    }


    let loadedDrawings = [];
    let resizeTimer = null;


    function arrangeDrawings() {
        if (!loadedDrawings.length) {
            return;
        }

        drawingsSection.innerHTML = "";

        const sectionWidth =
            drawingsSection.clientWidth;

        const isMobile =
            window.innerWidth <= 600;

        const edgePadding =
            isMobile ? 10 : 20;

        const collisionGap =
            isMobile ? 10 : 18;

        const random =
            createSeededRandom(240831);

        const shuffledDrawings =
            shuffleArray(loadedDrawings, random);

        const placedRectangles = [];

        let searchY = 30;
        let furthestBottom = 0;


        shuffledDrawings.forEach(
            ({ image, ratio }) => {

                const isHorizontal =
                    ratio >= 1;

                /*
                휴대폰과 컴퓨터에서 각각 크기 지정
                */
                let imageWidth;

                if (isMobile) {
                    imageWidth = isHorizontal
                        ? sectionWidth * 0.42
                        : sectionWidth * 0.294;
                    } else {
                        imageWidth = isHorizontal
                            ? sectionWidth * 0.28
                            : sectionWidth * 0.196;
                    }

                const imageHeight =
                    imageWidth / ratio;

                let position = null;
                let candidateY = searchY;

                /*
                빈 공간을 찾아 최대 500회 배치 시도
                */
                for (
                    let attempt = 0;
                    attempt < 500;
                    attempt++
                ) {
                    const maximumX =
                        Math.max(
                            edgePadding,
                            sectionWidth -
                            imageWidth -
                            edgePadding
                        );

                    const candidateX =
                        edgePadding +
                        random() *
                        Math.max(
                            0,
                            maximumX - edgePadding
                        );

                    const rectangle = {
                        x: candidateX,
                        y:
                            candidateY +
                            random() *
                            (isMobile ? 65 : 95),
                        width: imageWidth,
                        height: imageHeight
                    };

                    const overlaps =
                        placedRectangles.some(
                            (placedRectangle) => {
                                return rectanglesOverlap(
                                    rectangle,
                                    placedRectangle,
                                    collisionGap
                                );
                            }
                        );

                    if (!overlaps) {
                        position = rectangle;
                        break;
                    }

                    /*
                    빈자리를 못 찾으면 조금 아래에서 다시 탐색
                    */
                    if (attempt % 35 === 34) {
                        candidateY +=
                            isMobile ? 45 : 65;
                    }
                }

                /*
                드물게 빈자리를 못 찾으면
                가장 아래에 배치
                */
                if (!position) {
                    position = {
                        x:
                            edgePadding +
                            random() *
                            Math.max(
                                0,
                                sectionWidth -
                                imageWidth -
                                edgePadding * 2
                            ),
                        y:
                            furthestBottom +
                            collisionGap,
                        width: imageWidth,
                        height: imageHeight
                    };
                }

                placedRectangles.push(position);

                furthestBottom =
                    Math.max(
                        furthestBottom,
                        position.y +
                        position.height
                    );

                /*
                다음 이미지는 현재 최하단보다
                너무 멀리 내려가지 않도록 설정
                */
                searchY =
                    Math.max(
                        20,
                        furthestBottom -
                        (isMobile ? 260 : 360)
                    );

                const rotation =
                    -1.2 + random() * 2.4;

                image.style.width =
                    `${position.width}px`;

                image.style.left =
                    `${position.x}px`;

                image.style.top =
                    `${position.y}px`;

                image.style.transform =
                    `rotate(${rotation}deg)`;

                drawingsSection.appendChild(image);
            }
        );


        /*
        마지막 이미지 아래에만 작은 여백 추가
        */
        drawingsSection.style.height =
            `${furthestBottom + (isMobile ? 100 : 160)}px`;


        /*
        화면에 들어오는 이미지부터 서서히 표시
        */
        const drawingObserver =
            new IntersectionObserver(
                (entries, observer) => {
                    entries.forEach((entry) => {
                        if (!entry.isIntersecting) {
                            return;
                        }

                        entry.target.classList.add(
                        "visible"
                        );

                        observer.unobserve(
                        entry.target
                        );
                    });
                },
                {
                threshold: 0.08,
                rootMargin: "80px 0px"
                }
            );

        drawingsSection
            .querySelectorAll(".drawing")
            .forEach((drawing) => {
            drawingObserver.observe(drawing);
            });
    }


    async function initializeDrawings() {
        const loadedResults =
            await Promise.all(
                drawingFiles.map(loadDrawing)
            );

        loadedDrawings =
            loadedResults.filter(Boolean);

        arrangeDrawings();
    }


    initializeDrawings();


    /*
    화면 방향이나 크기가 실제로 크게 바뀐 경우에만
    드로잉을 다시 배치
    */
    window.addEventListener("resize", () => {
        clearTimeout(resizeTimer);

        resizeTimer = setTimeout(() => {
            arrangeDrawings();
        }, 250);
    });

    </script>


</body>

</html>
