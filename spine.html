<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>.o0O0o. — spine</title>

    <style>

        :root {

            /* Background */
            --bg: #A9A8A3;
            --bg-transparent: rgba(169, 168, 163, 0.98);

            
            /* Text */
            --text: #342A22;


            /* Lines */
            --line: #342A22;

            --line-soft: rgba(52, 42, 34, 0.28);
            --line-faint: rgba(52, 42, 34, 0.25);
            --text-muted: rgba(52, 42, 34, 0.6);
            --placeholder: rgba(52, 42, 34, 0.45);


            /* Hover */
            --hover: rgba(52,42,34,.08);

        }


        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            width: 100%;
            min-height: 100%;

            background: var(--bg);
            scroll-behavior: auto;
        }

        body {
            width: 100%;
            min-height: 100%;

            overflow-x: hidden;
            overflow-y: auto;

            background: var(--bg);

            -webkit-overflow-scrolling: touch;
        }

        #spine-page {
            position: relative;

            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;

            display: flex;
            flex-direction: column;
            align-items: center;

            background: var(--bg);
        }

        /*
            페이지 가장 위쪽 여백
        */
        .top-space {
            width: 100%;

            height: 40vh;
            height: 40dvh;

            flex-shrink: 0;
        }

        /*
            클릭 가능한 뇌 이미지 영역
        */
        #brain-link {
            display: block;

            width: fit-content;
            max-width: 90vw;

            cursor: pointer;

            text-decoration: none;

            -webkit-tap-highlight-color: transparent;
           
            transform: translateX(5px);
        }

        #brain-image {
            display: block;

            width: auto;
            height: auto;

            max-width: min(65vw, 650px);

            object-fit: contain;

            user-select: none;
            -webkit-user-select: none;
            -webkit-user-drag: none;

            transition:
                transform 0.8s cubic-bezier(0.16, 1, 0.3, 1),
                opacity 0.8s ease;

            transform: scale(1);
        }

        /*
            마우스를 올리면 뇌가 아주 살짝 커짐
        */
        #brain-link:hover #brain-image {
            transform: scale(1.025);
        }

        /*
            클릭할 때 살짝 작아지는 효과
        */
        #brain-link:active #brain-image {
            transform: scale(0.985);
        }

        /*
            뇌와 척추 사이 간격
        */
        .brain-spine-space {
            width: 100%;

            height: 0;
            margin-bottom: -5dvh;

            flex-shrink: 0;
        }

        #spine-image {
            display: block;

            width: auto;
            height: auto;

            max-width: min(90vw, 900px);

            object-fit: contain;

            opacity: 0;

            /*
                정중앙부터 위아래로 퍼지는 마스크
            */
            -webkit-mask-image:
                linear-gradient(
                    to bottom,
                    transparent 0%,
                    rgba(0, 0, 0, 0.15) 14%,
                    black 38%,
                    black 62%,
                    rgba(0, 0, 0, 0.15) 86%,
                    transparent 100%
                );

            mask-image:
                linear-gradient(
                    to bottom,
                    transparent 0%,
                    rgba(0, 0, 0, 0.15) 14%,
                    black 38%,
                    black 62%,
                    rgba(0, 0, 0, 0.15) 86%,
                    transparent 100%
                );

            -webkit-mask-size: 100% 2%;
            mask-size: 100% 2%;

            -webkit-mask-position: center;
            mask-position: center;

            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;

            transform: scale(0.99);

            user-select: none;
            -webkit-user-select: none;
            -webkit-user-drag: none;

            will-change:
                opacity,
                transform,
                -webkit-mask-size,
                mask-size;
        }

        /*
            척추 아래쪽으로도 스크롤 가능하게 하는 여백
        */
        .bottom-space {
            width: 100%;

            height: 5vh;
            height: 5dvh;

            flex-shrink: 0;
        }

        @media (max-width: 700px) {
            #brain-image {
                max-width: 82vw;
            }

            .top-space {
                height: 30vh;
                height: 30dvh;
            }

            .brain-spine-space {
                height: 0;
                margin-bottom: -5dvh;
            }

            .bottom-space {
                height: 3vh;
                height: 3dvh;
            }

        }

        @media (prefers-reduced-motion: reduce) {
            #spine-image {
                opacity: 1;
                transform: none;

                -webkit-mask-image: none;
                mask-image: none;
            }

            #brain-image {
                transition: none;
            }
        }

        #drawings {
            position: relative;

            width: 100%;
            max-width: 900px;
            min-height: 100vh;

            margin: 0 auto;
            overflow: hidden;
        }

        .drawing {
            position: absolute;
            display: block;

            width: auto;
            height: auto;

            object-fit: contain;

            user-select: none;
            -webkit-user-select: none;
            -webkit-user-drag: none;

            opacity: 0;

            /*
            JS에서 각 이미지의 회전값을 여기에 저장
            */
            --drawing-rotation: 0deg;

            transform:
                translateY(12px)
                rotate(var(--drawing-rotation));

            transform-origin: center;

            transition:
                opacity 0.75s ease,
                transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .drawing.visible {
            opacity: 1;

            transform:
                translateY(0)
                rotate(var(--drawing-rotation));
        }

        @media (hover: hover) {
            .drawing:hover {
                z-index: 10;

                transform:
                    translateY(0)
                    rotate(var(--drawing-rotation))
                    scale(1.025);
            }
        }

    
    .drawing {
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
    }

    #drawing-detail-overlay {
        position: fixed;
        inset: 0;
        z-index: 1000;

        overflow-x: hidden;
        overflow-y: auto;

        padding:
            max(24px, env(safe-area-inset-top))
            max(22px, env(safe-area-inset-right))
            max(50px, env(safe-area-inset-bottom))
            max(22px, env(safe-area-inset-left));

        background: var(--bg);

        opacity: 0;
        visibility: hidden;
        pointer-events: none;

        transition:
            opacity 0.3s ease,
            visibility 0.3s ease;

        transform: translateY(0);
        touch-action: pan-y;
    }

    #drawing-detail-overlay.open {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
    }

    #drawing-detail-overlay.dragging {
        transition: none;
    }

    #drawing-detail-overlay.closing-by-swipe {
        transition:
            transform 0.25s ease,
            opacity 0.25s ease;
    }

    #drawing-detail-inner {
        width: 100%;
        max-width: 760px;
        min-height: 100%;

        margin: 0 auto;
        padding-top: 42px;
    }

    #drawing-detail-image-wrap {
        width: 100%;
    }

    #drawing-detail-image {
        display: block;

        width: auto;
        height: auto;

        max-width: 100%;
        max-height: 58vh;
        max-height: 58dvh;

        object-fit: contain;

        user-select: none;
        -webkit-user-select: none;
        -webkit-user-drag: none;
    }

    /* 가로 그림 */
    #drawing-detail-overlay.horizontal
    #drawing-detail-image-wrap {
        display: flex;
        justify-content: flex-end;
    }

    #drawing-detail-overlay.horizontal
    #drawing-detail-image {
        max-width: min(78vw, 650px);
        margin: 0;
    }

    /* 세로 그림 */
    #drawing-detail-overlay.vertical
    #drawing-detail-image-wrap {
        display: flex;
        justify-content: flex-end;
    }

    #drawing-detail-overlay.vertical
    #drawing-detail-image {
        max-width: min(56vw, 480px);
        margin: 0;
    }

    #drawing-detail-text {
        width: 100%;

        margin-top: 22px;

        color: var(--text);
        text-align: right;

        padding-right: 16px;
        box-sizing: border-box;
    }

    #drawing-detail-description {
        margin-top: 16px;

        font-family: serif;
        font-size: clamp(13px, 1.7vw, 17px);
        line-height: 1.75;

        white-space: pre-line;
    }

    @media (max-width: 700px) {
        #drawing-detail-overlay {
            padding:
                max(20px, env(safe-area-inset-top))
                max(18px, env(safe-area-inset-right))
                max(44px, env(safe-area-inset-bottom))
                max(18px, env(safe-area-inset-left));
        }

        #drawing-detail-inner {
            padding-top: 38px;
        }

        #drawing-detail-overlay.horizontal
        #drawing-detail-image-wrap,
        #drawing-detail-overlay.vertical
        #drawing-detail-image-wrap {
            display: flex;
            justify-content: flex-end;
        }

        #drawing-detail-overlay.horizontal
        #drawing-detail-image {
            max-width: 86vw;
            max-height: 48dvh;
            margin: 0;
        }

        #drawing-detail-overlay.vertical
        #drawing-detail-image {
            max-width: 62vw;
            max-height: 58dvh;
            margin: 0;
        }

        #drawing-detail-text {
            margin-top: 22px;
        }

        #drawing-detail-description {
            margin-top: 13px;
            font-size: 12px;
            line-height: 1.7;
        }

        #drawing-detail-overlay.vertical
        #drawing-detail-text {
            width: 55vw;

            margin-left: auto;
            margin-right: 0;

            text-align: right;
        }
    }    

    </style>
</head>

        const spineImage =
            document.querySelector("#spine-image");

        let revealAnimation = null;

        /*
            새로고침하거나 뒤로 왔을 때
            이전 스크롤 위치가 자동 복원되지 않게 함
        */
        if ("scrollRestoration" in history) {
            history.scrollRestoration = "manual";
        }

        /*
            척추 이미지의 정중앙을
            화면 정중앙에 맞춤
        */
        function centerSpineImage() {
            const imageCenter =
                spineImage.offsetTop +
                spineImage.offsetHeight / 2;

            const targetScroll =
                imageCenter -
                window.innerHeight / 2;

            window.scrollTo({
                top: Math.max(0, targetScroll),
                left: 0,
                behavior: "auto"
            });
        }

       /*
        등장 애니메이션이 끝난 뒤
        남아 있는 위아래 마스크를 제거
       */
       function finishReveal() {
            spineImage.style.opacity = "1";
            spineImage.style.transform = "scale(1)";

        if (revealAnimation) {
            revealAnimation.cancel();
            revealAnimation = null;
            }

        }

        /*
            척추 정중앙에서 위아래로 퍼지며 등장
        */
        function revealSpineImage() {
            centerSpineImage();

            requestAnimationFrame(() => {
                requestAnimationFrame(() => {

                    revealAnimation = spineImage.animate(
                        [
                            {
                                opacity: 0,
                                transform: "scale(0.99)",

                                webkitMaskSize: "100% 2%",
                                maskSize: "100% 2%"
                            },
                            {
                                opacity: 0.2,
                                transform: "scale(0.992)",

                                webkitMaskSize: "100% 20%",
                                maskSize: "100% 20%",

                                offset: 0.16
                            },
                            {
                                opacity: 0.72,
                                transform: "scale(0.998)",

                                webkitMaskSize: "100% 115%",
                                maskSize: "100% 115%",

                                offset: 0.65
                            },
                            {
                                opacity: 1,
                                transform: "scale(1)",

                                webkitMaskSize: "100% 220%",
                                maskSize: "100% 220%"
                            }
                        ],
                        {
                            duration: 4200,

                            easing:
                                "cubic-bezier(0.16, 1, 0.3, 1)",

                            fill: "forwards"
                        }
                    );
                    

                    requestAnimationFrame(() => {
                        document
                            .querySelectorAll(".drawing")
                            .forEach((drawing) => {
                                drawing.classList.add("visible");
                            });
});

                    /* 여기부터 추가 */
                    setTimeout(() => {
                        spineImage.style.webkitMaskImage = "none";
                        spineImage.style.maskImage = "none";
                    }, 1000);

                    revealAnimation.addEventListener(
                        "finish",
                        finishReveal,
                        { once: true }
                    );

                });
            });
        }

        /*
            척추 이미지가 완전히 로딩된 후
            위치 계산과 등장 애니메이션 실행
        */
        if (spineImage.complete) {
            revealSpineImage();
        } else {
            spineImage.addEventListener(
                "load",
                revealSpineImage,
                { once: true }
            );
        }

        spineImage.addEventListener(
            "error",
            () => {
                console.error(
                    "images/spine.png 파일을 불러오지 못했습니다."

        let drawingDetailScrollY = 0;


        function getDrawingTitle(fileName) {
            return fileName
                .replace(/\.[^.]+$/, "")
                .replace(/^[HV]\d+_?/, "")
                .replaceAll("_", " ");
        }


        function openDrawingDetail(fileName, ratio) {
            const information =
                drawingDescriptions[fileName] || {};

            const description =
                information.description || "";

            drawingDetailImage.src =
                `images/drawings/${fileName}`;

            drawingDetailDescription.textContent = description;

            drawingDetailOverlay.classList.remove(
                "horizontal",
                "vertical"
            );

            drawingDetailOverlay.classList.add(
                ratio >= 1
                    ? "horizontal"
                    : "vertical"
            );

            drawingDetailScrollY = window.scrollY;

            document.body.style.position = "fixed";
            document.body.style.top =
                `-${drawingDetailScrollY}px`;
            document.body.style.width = "100%";

            drawingDetailOverlay.classList.add("open");
            drawingDetailOverlay.setAttribute(
                "aria-hidden",
                "false"
            );

            drawingDetailOverlay.scrollTop = 0;
        }


        function closeDrawingDetail() {
            drawingDetailOverlay.classList.remove(
                "open",
                "dragging",
                "closing-by-swipe"
            );

            drawingDetailOverlay.setAttribute(
                "aria-hidden",
                "true"
            );

            drawingDetailOverlay.style.transform =
                "translateY(0)";

            drawingDetailOverlay.style.opacity = "";

            document.body.style.position = "";
            document.body.style.top = "";
            document.body.style.width = "";

            window.scrollTo(0, drawingDetailScrollY);
        }

        /*
        새로고침해도 같은 랜덤 배치가 나오게 하는
        고정 랜덤 숫자 생성기
        */
        function createSeededRandom(seed) {
            let value = seed;

            return function random() {
                value |= 0;
                value = value + 0x6D2B79F5 | 0;

                let result = Math.imul(
                    value ^ value >>> 15,
                    1 | value
                );

            result =
                result +
                Math.imul(
                    result ^ result >>> 7,
                    61 | result
                ) ^
                result;

            return (
                (result ^ result >>> 14) >>> 0
            ) / 4294967296;
        };
    }

    function shuffleArray(array, random) {
        const copiedArray = [...array];

        for (
            let index = copiedArray.length - 1;
            index > 0;
            index--
        ) {
            const randomIndex =
                Math.floor(random() * (index + 1));

            [
                copiedArray[index],
                copiedArray[randomIndex]
            ] = [
                copiedArray[randomIndex],
                copiedArray[index]
            ];
        }

        return copiedArray;
    }


    function loadDrawing(fileName) {
        return new Promise((resolve) => {
            const image = new Image();

            image.className = "drawing";
            image.src =
                `images/drawings/${fileName}`;

            image.alt = fileName
                .replace(/\.[^.]+$/, "")
                .replace(/^[HV]\d+_?/, "")
                .replaceAll("_", " ");

            image.draggable = false;

            image.addEventListener("click", () => {
                openDrawingDetail(
                    fileName,
                    image.naturalWidth / image.naturalHeight
                );
            });

            image.addEventListener(
                "load",
                () => {
                    resolve({
                        fileName,
                        image,

                        /*
                            실제 이미지 크기로 비율 계산
                        */
                        ratio:
                            image.naturalWidth /
                            image.naturalHeight
                    });
                },
                { once: true }
            );

            image.addEventListener(
                "error",
                () => {
                    console.error(
                        `이미지를 불러오지 못했습니다: ${fileName}`
                    );

                    /*
                        파일 하나가 깨져도 나머지는 계속 배치
                    */
                    resolve(null);
                },
                { once: true }
            );
        });
    }


    /*
    두 이미지가 서로 겹치는지 확인
    */
    function rectanglesOverlap(first, second, gap) {
        return !(
            first.x + first.width + gap <= second.x ||
            second.x + second.width + gap <= first.x ||
            first.y + first.height + gap <= second.y ||
            second.y + second.height + gap <= first.y
        );
    }


    let loadedDrawings = [];
    let resizeTimer = null;


    function arrangeDrawings() {
        if (!loadedDrawings.length) {
            return;
        }

        drawingsSection.innerHTML = "";

        const sectionWidth =
            drawingsSection.clientWidth;

        const isMobile =
            window.innerWidth <= 600;

        const edgePadding =
            isMobile ? 10 : 20;

        const collisionGap =
            isMobile ? 4 : 18;

        /*
        이 숫자를 바꾸면 전체 배치가 달라짐
        */
        const random =
            createSeededRandom(731204);

        const shuffledDrawings =
            shuffleArray(loadedDrawings, random);

        /*
            모바일에서는 행 단위로 배치:
            한 장짜리 행은 절대 연속되지 않음
        */
        if (isMobile) {
            const drawingsToPlace = [...shuffledDrawings];

            let currentY = 20;
            let previousRowCount = 2;
            let horizontalGoesLeft = true;

            while (drawingsToPlace.length > 0) {
                /*
                    직전 행이 1장이었다면 이번 행은 무조건 2장.
                    직전 행이 2장이었다면 1장 또는 2장 중 랜덤.
                */
                let rowCount;

                if (previousRowCount === 1) {
                    rowCount = 2;
                } else {
                    rowCount = random() < 0.42 ? 1 : 2;
                }

                rowCount = Math.min(
                    rowCount,
                    drawingsToPlace.length
                );

                let rowDrawings;

                /*
                    1장짜리 행에는 가로 그림만
                */
                if (rowCount === 1) {
                    const horizontalIndex =
                        drawingsToPlace.findIndex(
                            ({ ratio }) => ratio >= 1
                        );

                    if (horizontalIndex !== -1) {
                        rowDrawings = drawingsToPlace.splice(
                            horizontalIndex,
                            1
                        );
                    } else {
                        /*
                            가로 그림이 없으면
                            1장 행을 만들지 않고 2장 행으로 변경
                        */
                        rowCount = Math.min(
                            2,
                            drawingsToPlace.length
                        );
                    }
                }


                /*
                    2장짜리 행:
                    가로+가로 또는 가로+세로만 허용
                */
                if (rowCount === 2) {
                    const firstHorizontalIndex =
                        drawingsToPlace.findIndex(
                            ({ ratio }) => ratio >= 1
                        );

                    /*
                        가로 그림이 하나라도 있으면
                        무조건 첫 번째로 꺼냄
                    */
                    if (firstHorizontalIndex !== -1) {
                        const firstHorizontal =
                            drawingsToPlace.splice(
                                firstHorizontalIndex,
                                1
                            )[0];

                        /*
                            두 번째 그림은 남은 것 중 아무거나
                            → 가로 또는 세로
                        */
                        const verticalIndex =
                            drawingsToPlace.findIndex(
                                ({ ratio }) => ratio < 1
                            );

                        let secondDrawing;

                        if (verticalIndex !== -1) {
                            secondDrawing =
                                drawingsToPlace.splice(
                                    verticalIndex,
                                    1
                                )[0];
                        } else {
                            secondDrawing =
                                drawingsToPlace.splice(0, 1)[0];
                        }

                        rowDrawings = [
                            firstHorizontal,
                            secondDrawing
                        ].filter(Boolean);
                    } else {
                        /*
                            남은 그림이 전부 세로라면
                            세로+세로를 만들지 않기 위해
                            남은 그림을 한 장씩 처리
                        */
                        rowCount = 1;

                        rowDrawings =
                            drawingsToPlace.splice(0, 1);
                    }
                }

                let rowItems = rowDrawings.map(
                    ({ image, ratio }) => {
                        const isHorizontal = ratio >= 1;

                        const width = isHorizontal
                            ? sectionWidth * 0.50
                            : sectionWidth * 0.35;

                        return {
                            image,
                            ratio,
                            width,
                            height: width / ratio
                        };
                    }
                );

                /*
                    가로+세로 혼합 행은 좌우 순서를 번갈아 배치
                */
                if (rowCount === 2) {
                    const horizontalItem =
                        rowItems.find((item) => item.ratio >= 1);

                    const verticalItem =
                        rowItems.find((item) => item.ratio < 1);

                    if (horizontalItem && verticalItem) {
                        rowItems = horizontalGoesLeft
                            ? [horizontalItem, verticalItem]
                            : [verticalItem, horizontalItem];

                        horizontalGoesLeft =
                            !horizontalGoesLeft;
                    }
                }

                let rowBottom = currentY;

                /*
                    한 장짜리 행
                */
                if (rowCount === 1) {
                    const item = rowItems[0];

                    const maximumX =
                        sectionWidth -
                        item.width -
                        edgePadding;

                    const center =
                        (sectionWidth - item.width) / 2;

                    let x =
                        center +
                        (random() - 0.5) *
                        sectionWidth *
                        0.17;

                    /*
                        혹시라도 화면 밖으로 나가지 않게 제한
                    */
                    x = Math.max(
                        edgePadding,
                        Math.min(maximumX, x)
                    );

                    const rotation =
                        random() < 0.25
                            ? 0
                            : -1.8 + random() * 3.6;

                    item.image.style.width =
                        `${item.width}px`;

                    item.image.style.left =
                        `${x}px`;

                    item.image.style.top =
                        `${currentY}px`;

                    item.image.style.setProperty(
                        "--drawing-rotation",
                        `${rotation}deg`
                    );

                    drawingsSection.appendChild(
                        item.image
                    );

                    rowBottom =
                        currentY + item.height;
                }

                /*
                    두 장짜리 행
                */
                if (rowCount === 2) {
                    const first = rowItems[0];
                    const second = rowItems[1];

                    const sidePadding = edgePadding;

                    /*
                        두 그림을 좌우에 놓되,
                        각 행마다 좌우 위치와 높이를 조금씩 다르게
                    */
                    const firstX =
                        sidePadding +
                        random() *
                        sectionWidth *
                        0.08;

                    const secondX =
                        sectionWidth -
                        second.width -
                        sidePadding -
                        random() *
                        sectionWidth *
                        0.08;

                    /*
                        두 그림 사이 최소 간격
                    */
                    const minimumGap =
                        sectionWidth * 0.045;

                    let adjustedSecondX = secondX;

                    const currentGap =
                        adjustedSecondX -
                        (firstX + first.width);

                    if (currentGap < minimumGap) {
                        adjustedSecondX =
                            firstX +
                            first.width +
                            minimumGap;
                    }

                    /*
                        오른쪽 화면 밖으로 나가지 않게 제한
                    */
                    adjustedSecondX = Math.min(
                        adjustedSecondX,
                        sectionWidth -
                        second.width -
                        sidePadding
                    );

                    /*
                        같은 수평선에 정확히 맞지 않게
                        한쪽을 위아래로 어긋나게 함
                    */
                    const stagger =
                        12 + random() * 38;

                    const firstGoesDown =
                        random() < 0.5;

                    const firstY =
                        currentY +
                        (firstGoesDown ? stagger : 0);

                    const secondY =
                        currentY +
                        (firstGoesDown ? 0 : stagger);

                    [first, second].forEach(
                        (item, index) => {
                            const x =
                                index === 0
                                    ? firstX
                                    : adjustedSecondX;

                            const y =
                                index === 0
                                    ? firstY
                                    : secondY;

                            const rotation =
                                random() < 0.25
                                    ? 0
                                    : -1.8 +
                                    random() * 3.6;

                            item.image.style.width =
                                `${item.width}px`;

                            item.image.style.left =
                                `${x}px`;

                            item.image.style.top =
                                `${y}px`;

                            item.image.style.setProperty(
                                "--drawing-rotation",
                                `${rotation}deg`
                            );

                            drawingsSection.appendChild(
                                item.image
                            );
                        }
                    );

                    rowBottom = Math.max(
                        firstY + first.height,
                        secondY + second.height
                    );
                }

                previousRowCount = rowCount;

                /*
                    다음 행과의 간격도 조금씩 불규칙하게
                    너무 벌어지지 않도록 작은 값 사용
                */
                currentY =
                    rowBottom +
                    12 +
                    random() * 24;
            }

            drawingsSection.style.height =
                `${currentY + 80}px`;



            return;
        }

        const placedRectangles = [];

        /*
        최근 그림들의 가로 중심점을 저장해서
        같은 세로열이 반복되는 것을 방지
        */
        const recentCenters = [];

        let searchY = 30;
        let furthestBottom = 0;


        shuffledDrawings.forEach(
            ({ image, ratio }, drawingIndex) => {

                const isHorizontal =
                    ratio >= 1;

                /*
                모든 종이의 실제 크기가 같아 보이도록
                긴 변 길이를 통일
                */
                let imageWidth;

                if (isMobile) {
                    imageWidth = isHorizontal
                        ? sectionWidth * 0.42
                        : sectionWidth * 0.294;
                } else {
                    imageWidth = isHorizontal
                        ? sectionWidth * 0.28
                        : sectionWidth * 0.196;
                }

                const imageHeight =
                    imageWidth / ratio;

                let position = null;
                let candidateY = searchY;


                /*
                여러 후보 중 첫 번째 빈자리만 쓰지 않고,
                비교적 좋은 위치 후보들을 수집
                */
                for (
                    let verticalStep = 0;
                    verticalStep < 16;
                    verticalStep++
                ) {
                    const candidates = [];

                    for (
                        let attempt = 0;
                        attempt < 40;
                        attempt++
                    ) {
                        const maximumX =
                            Math.max(
                                edgePadding,
                                sectionWidth -
                                imageWidth -
                                edgePadding
                            );

                        const candidateX =
                            edgePadding +
                            random() *
                            Math.max(
                                0,
                                maximumX - edgePadding
                            );

                        const rectangle = {
                            x: candidateX,

                            y:
                                candidateY +
                                random() *
                                (isMobile ? 30 : 100),

                            width: imageWidth,
                            height: imageHeight
                        };

                        const overlaps =
                            placedRectangles.some(
                                (placedRectangle) => {
                                    return rectanglesOverlap(
                                        rectangle,
                                        placedRectangle,
                                        collisionGap
                                    );
                                }
                            );

                        if (overlaps) {
                            continue;
                        }

                        const candidateCenter =
                            rectangle.x +
                            rectangle.width / 2;

                        /*
                        최근 이미지들과 가로 중심이 비슷할수록
                        높은 벌점을 줌
                        */
                        let alignmentPenalty = 0;

                        recentCenters.forEach(
                            (recentCenter, index) => {
                                const distance =
                                    Math.abs(
                                        candidateCenter -
                                        recentCenter
                                    );

                                const minimumDistance =
                                    isMobile
                                        ? sectionWidth * 0.29
                                        : sectionWidth * 0.15;

                                if (distance < minimumDistance) {
                                    /*
                                    가장 최근 그림일수록
                                    더 강하게 피함
                                    */
                                    alignmentPenalty +=
                                        (
                                            minimumDistance -
                                            distance
                                        ) *
                                        (recentCenters.length - index)*
                                        (isMobile ? 4 : 1);
                                }
                            }
                        );

                        /*
                        화면 한가운데로만 몰리는 것도 살짝 방지
                        */
                        const pageCenter =
                            sectionWidth / 2;

                        const centerDistance =
                            Math.abs(
                                candidateCenter -
                                pageCenter
                            );

                        const centerPenalty =
                            centerDistance <
                            sectionWidth * 0.08
                                ? 18
                                : 0;

                        /*
                        완전히 규칙적이지 않도록
                        작은 랜덤값도 점수에 포함
                        */
                        const score =
                            alignmentPenalty +
                            centerPenalty +
                            random() * 20;

                        candidates.push({
                            rectangle,
                            score
                        });
                    }

                    if (candidates.length) {
                        /*
                        점수가 가장 낮은,
                        즉 세로 정렬이 가장 덜한 위치 선택
                        */
                        candidates.sort(
                            (first, second) =>
                                first.score - second.score
                        );

                        position =
                            candidates[0].rectangle;

                        break;
                    }

                    candidateY +=
                        isMobile ? 24 : 65;
                }


                /*
                적당한 빈자리를 찾지 못했을 경우
                현재 최하단 아래에 배치
                */
                if (!position) {
                    const maximumX =
                        Math.max(
                            0,
                            sectionWidth -
                            imageWidth -
                            edgePadding * 2
                        );

                    position = {
                        x:
                            edgePadding +
                            random() * maximumX,

                        y:
                            furthestBottom +
                            collisionGap,

                        width: imageWidth,
                        height: imageHeight
                    };
                }


                placedRectangles.push(position);

                const positionCenter =
                    position.x +
                    position.width / 2;

                recentCenters.push(positionCenter);

                /*
                최근 4장의 가로 위치만 기억
                */
                if (recentCenters.length > 6) {
                    recentCenters.shift();
                }


                furthestBottom =
                    Math.max(
                        furthestBottom,
                        position.y +
                        position.height
                    );

                /*
                너무 넓은 공백 없이
                다음 그림의 탐색 위치를 설정
                */
                searchY =
                    Math.max(
                        20,
                        furthestBottom -
                        (isMobile ? 330 : 350)
                    );


                /*
                일부는 수평,
                나머지는 아주 조금씩만 회전
                */
                let rotation;

                if (drawingIndex % 4 === 0) {
                    rotation = 0;
                } else {
                    rotation =
                        -1.8 + random() * 3.6;
                }


                image.style.width =
                    `${position.width}px`;

                image.style.left =
                    `${position.x}px`;

                image.style.top =
                    `${position.y}px`;

                /*
                transform을 직접 지정하지 않고
                CSS 변수로 회전값 전달
                */
                image.style.setProperty(
                    "--drawing-rotation",
                    `${rotation}deg`
                );

                drawingsSection.appendChild(image);
            }
        );


        drawingsSection.style.height =
            `${furthestBottom + (isMobile ? 100 : 160)}px`;


        return;
    }


    async function initializeDrawings() {
        const loadedResults =
            await Promise.all(
                drawingFiles.map(loadDrawing)
            );

        loadedDrawings =
            loadedResults.filter(Boolean);

        arrangeDrawings();
    }


    initializeDrawings();


    /*
    드로잉 상세보기 닫기
    */
    drawingDetailOverlay.addEventListener(
        "click",
        (event) => {
            /*
                이미지나 제목·설명을 누른 경우에는 닫지 않음
            */
            if (
                event.target.closest(
                    "#drawing-detail-image, #drawing-detail-text"
                )
            ) {
                return;
            }

            /*
                그 외의 빈 배경을 누르면 닫음
            */
            closeDrawingDetail();
        }
    );


    document.addEventListener("keydown", (event) => {
        if (
            event.key === "Escape" &&
            drawingDetailOverlay.classList.contains("open")
        ) {
            closeDrawingDetail();
        }
    });

    /*
    드로잉 상세보기 닫기: 스와이프 제스처
    */
    let detailTouchStartY = 0;
    let detailTouchCurrentY = 0;
    let detailTouchStartTime = 0;
    let isDetailDragging = false;


    drawingDetailOverlay.addEventListener(
        "touchstart",
        (event) => {
            /*
                상세 화면이 열려 있지 않으면 실행하지 않음
            */
            if (
                !drawingDetailOverlay.classList.contains("open")
            ) {
                return;
            }

            /*
                상세 화면을 아래로 스크롤한 상태에서는
                먼저 위로 되돌아온 뒤 스와이프 닫기 가능
            */
            if (drawingDetailOverlay.scrollTop > 0) {
                return;
            }

            const touch = event.touches[0];

            detailTouchStartY = touch.clientY;
            detailTouchCurrentY = touch.clientY;
            detailTouchStartTime = Date.now();
            isDetailDragging = false;
        },
        { passive: true }
    );


    drawingDetailOverlay.addEventListener(
        "touchmove",
        (event) => {
            if (
                !drawingDetailOverlay.classList.contains("open")
            ) {
                return;
            }

            if (drawingDetailOverlay.scrollTop > 0) {
                return;
            }

            const touch = event.touches[0];

            detailTouchCurrentY = touch.clientY;

            const distance =
                detailTouchCurrentY - detailTouchStartY;

            /*
                위로 미는 동작은 무시
            */
            if (distance <= 0) {
                return;
            }

            /*
                조금 움직인 정도는 일반 터치로 처리
            */
            if (distance > 8) {
                isDetailDragging = true;
            }

            if (!isDetailDragging) {
                return;
            }

            event.preventDefault();

            drawingDetailOverlay.classList.add("dragging");

            drawingDetailOverlay.style.transform =
                `translateY(${distance}px)`;

            /*
                아래로 내릴수록 아주 조금 투명해짐
            */
            const opacity =
                Math.max(
                    0.35,
                    1 - distance / window.innerHeight
                );

            drawingDetailOverlay.style.opacity =
                String(opacity);
        },
        { passive: false }
    );


    drawingDetailOverlay.addEventListener(
        "touchend",
        () => {
            if (!isDetailDragging) {
                return;
            }

            const distance =
                detailTouchCurrentY - detailTouchStartY;

            const elapsed =
                Math.max(
                    1,
                    Date.now() - detailTouchStartTime
                );

            const velocity =
                distance / elapsed;

            drawingDetailOverlay.classList.remove("dragging");

            /*
                120px 이상 내렸거나
                빠르게 아래로 휙 내렸으면 닫기
            */
            if (
                distance > 120 ||
                velocity > 0.65
            ) {
                drawingDetailOverlay.classList.add(
                    "closing-by-swipe"
                );

                drawingDetailOverlay.style.transform =
                    "translateY(100dvh)";

                drawingDetailOverlay.style.opacity = "0";

                setTimeout(() => {
                    closeDrawingDetail();
                }, 250);
            } else {
                /*
                    충분히 내리지 않았다면 원위치
                */
                drawingDetailOverlay.style.transform =
                    "translateY(0)";

                drawingDetailOverlay.style.opacity = "1";
            }

            isDetailDragging = false;
        }
    );

    /*
    화면 방향이나 크기가 실제로 크게 바뀐 경우에만
    드로잉을 다시 배치
    */
    window.addEventListener("resize", () => {
        clearTimeout(resizeTimer);

        resizeTimer = setTimeout(() => {
            arrangeDrawings();
        }, 250);
    });

    </script>


</body>
