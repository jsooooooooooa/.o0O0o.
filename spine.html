<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>.o0O0o. — spine</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            width: 100%;
            min-height: 100%;
            background: #ece4ce;
            scroll-behavior: auto;
        }

        body {
            width: 100%;
            min-height: 100%;

            overflow-x: hidden;
            overflow-y: auto;

            background: #ece4ce;

            -webkit-overflow-scrolling: touch;
        }

        #spine-page {
            position: relative;

            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;

            display: flex;
            flex-direction: column;
            align-items: center;

            background: #ece4ce;
        }

        /*
            이미지 정중앙에서 시작한 뒤에도
            위쪽과 아래쪽으로 스크롤할 수 있도록
            이미지 앞뒤에 빈 공간을 둠
        */
        .scroll-space {
            width: 100%;

            height: 55vh;
            height: 55dvh;

            flex-shrink: 0;
        }

        #spine-image {
            display: block;

            width: auto;
            height: auto;

            max-width: min(72vw, 700px);

            object-fit: contain;

            /*
                처음에는 완전히 투명
            */
            opacity: 0;

            /*
                척추 정중앙부터 위아래로
                부드럽게 퍼지도록 하는 마스크
            */
            -webkit-mask-image:
                linear-gradient(
                    to bottom,
                    transparent 0%,
                    rgba(0, 0, 0, 0.15) 14%,
                    black 38%,
                    black 62%,
                    rgba(0, 0, 0, 0.15) 86%,
                    transparent 100%
                );

            mask-image:
                linear-gradient(
                    to bottom,
                    transparent 0%,
                    rgba(0, 0, 0, 0.15) 14%,
                    black 38%,
                    black 62%,
                    rgba(0, 0, 0, 0.15) 86%,
                    transparent 100%
                );

            /*
                처음에는 마스크가 가운데의
                아주 작은 부분만 차지함
            */
            -webkit-mask-size: 100% 2%;
            mask-size: 100% 2%;

            -webkit-mask-position: center;
            mask-position: center;

            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;

            transform: scale(0.99);

            user-select: none;
            -webkit-user-select: none;
            -webkit-user-drag: none;

            will-change:
                opacity,
                transform,
                -webkit-mask-size,
                mask-size;
        }

        @media (max-width: 700px) {
            #spine-image {
                max-width: 88vw;
            }

            .scroll-space {
                height: 52vh;
                height: 52dvh;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            #spine-image {
                opacity: 1;
                transform: none;

                -webkit-mask-image: none;
                mask-image: none;
            }
        }
    </style>
</head>

<body>

    <main id="spine-page">

        <div
            class="scroll-space"
            aria-hidden="true"
        ></div>

        <img
            id="spine-image"
            src="images/spine.png"
            alt="척추 드로잉"
            draggable="false"
        >

        <div
            class="scroll-space"
            aria-hidden="true"
        ></div>

    </main>

    <script>
        const spineImage =
            document.querySelector("#spine-image");

        let revealAnimation = null;

        /*
            새로고침이나 뒤로 가기 시
            브라우저가 이전 스크롤 위치를
            자동으로 복원하지 않도록 설정
        */
        if ("scrollRestoration" in history) {
            history.scrollRestoration = "manual";
        }

        /*
            척추 이미지의 정확한 세로 정중앙을
            화면 정중앙에 위치시킴
        */
        function centerSpineImage() {
            const imageCenter =
                spineImage.offsetTop +
                spineImage.offsetHeight / 2;

            const targetScroll =
                imageCenter -
                window.innerHeight / 2;

            window.scrollTo({
                top: Math.max(0, targetScroll),
                left: 0,
                behavior: "auto"
            });
        }

        /*
            애니메이션이 끝나면
            마스크를 완전히 제거해서
            척추 위아래까지 모두 선명하게 만듦
        */
        function finishReveal() {
            spineImage.style.opacity = "1";
            spineImage.style.transform = "scale(1)";

            spineImage.style.webkitMaskImage = "none";
            spineImage.style.maskImage = "none";

            spineImage.style.webkitMaskSize = "";
            spineImage.style.maskSize = "";

            if (revealAnimation) {
                revealAnimation.cancel();
                revealAnimation = null;
            }
        }

        /*
            척추 정중앙에서 시작해서
            위아래로 동시에 퍼지는 애니메이션
        */
        function revealSpineImage() {
            centerSpineImage();

            requestAnimationFrame(() => {
                requestAnimationFrame(() => {

                    revealAnimation = spineImage.animate(
                        [
                            {
                                opacity: 0,
                                transform: "scale(0.99)",

                                webkitMaskSize: "100% 2%",
                                maskSize: "100% 2%"
                            },
                            {
                                opacity: 0.2,
                                transform: "scale(0.992)",

                                webkitMaskSize: "100% 20%",
                                maskSize: "100% 20%",

                                offset: 0.16
                            },
                            {
                                opacity: 0.72,
                                transform: "scale(0.998)",

                                webkitMaskSize: "100% 115%",
                                maskSize: "100% 115%",

                                offset: 0.65
                            },
                            {
                                opacity: 1,
                                transform: "scale(1)",

                                webkitMaskSize: "100% 220%",
                                maskSize: "100% 220%"
                            }
                        ],
                        {
                            duration: 3200,
                            easing:
                                "cubic-bezier(0.16, 1, 0.3, 1)",

                            fill: "forwards"
                        }
                    );

                    revealAnimation.addEventListener(
                        "finish",
                        finishReveal,
                        { once: true }
                    );

                });
            });
        }

        /*
            척추 이미지가 완전히 로딩된 뒤 실행
        */
        if (spineImage.complete) {
            revealSpineImage();
        } else {
            spineImage.addEventListener(
                "load",
                revealSpineImage,
                { once: true }
            );
        }

        /*
            이미지 로딩에 실패했는지 확인하기 위한 처리
        */
        spineImage.addEventListener(
            "error",
            () => {
                console.error(
                    "images/spine.png 파일을 불러오지 못했습니다."
                );
            },
            { once: true }
        );

        /*
            화면 크기가 달라지면
            척추 중앙을 다시 화면 중앙에 맞춤
        */
        window.addEventListener("resize", () => {
            centerSpineImage();
        });
    </script>

</body>
</html>
