<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>.o0O0o. — spine</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            width: 100%;
            min-height: 100%;

            background: #ece4ce;
            scroll-behavior: auto;
        }

        body {
            width: 100%;
            min-height: 100%;

            overflow-x: hidden;
            overflow-y: auto;

            background: #ece4ce;

            -webkit-overflow-scrolling: touch;
        }

        #spine-page {
            position: relative;

            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;

            display: flex;
            flex-direction: column;
            align-items: center;

            background: #ece4ce;
        }

        /*
            페이지 가장 위쪽 여백
        */
        .top-space {
            width: 100%;

            height: 40vh;
            height: 40dvh;

            flex-shrink: 0;
        }

        /*
            클릭 가능한 뇌 이미지 영역
        */
        #brain-link {
            display: block;

            width: fit-content;
            max-width: 90vw;

            cursor: pointer;

            text-decoration: none;

            -webkit-tap-highlight-color: transparent;
           
            transform: translateX(5px);
        }

        #brain-image {
            display: block;

            width: auto;
            height: auto;

            max-width: min(65vw, 650px);

            object-fit: contain;

            user-select: none;
            -webkit-user-select: none;
            -webkit-user-drag: none;

            transition:
                transform 0.8s cubic-bezier(0.16, 1, 0.3, 1),
                opacity 0.8s ease;

            transform: scale(1);
        }

        /*
            마우스를 올리면 뇌가 아주 살짝 커짐
        */
        #brain-link:hover #brain-image {
            transform: scale(1.025);
        }

        /*
            클릭할 때 살짝 작아지는 효과
        */
        #brain-link:active #brain-image {
            transform: scale(0.985);
        }

        /*
            뇌와 척추 사이 간격
        */
        .brain-spine-space {
            width: 100%;

            height: 0;
            margin-bottom: -5dvh;

            flex-shrink: 0;
        }

        #spine-image {
            display: block;

            width: auto;
            height: auto;

            max-width: min(90vw, 900px);

            object-fit: contain;

            opacity: 0;

            /*
                정중앙부터 위아래로 퍼지는 마스크
            */
            -webkit-mask-image:
                linear-gradient(
                    to bottom,
                    transparent 0%,
                    rgba(0, 0, 0, 0.15) 14%,
                    black 38%,
                    black 62%,
                    rgba(0, 0, 0, 0.15) 86%,
                    transparent 100%
                );

            mask-image:
                linear-gradient(
                    to bottom,
                    transparent 0%,
                    rgba(0, 0, 0, 0.15) 14%,
                    black 38%,
                    black 62%,
                    rgba(0, 0, 0, 0.15) 86%,
                    transparent 100%
                );

            -webkit-mask-size: 100% 2%;
            mask-size: 100% 2%;

            -webkit-mask-position: center;
            mask-position: center;

            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;

            transform: scale(0.99);

            user-select: none;
            -webkit-user-select: none;
            -webkit-user-drag: none;

            will-change:
                opacity,
                transform,
                -webkit-mask-size,
                mask-size;
        }

        /*
            척추 아래쪽으로도 스크롤 가능하게 하는 여백
        */
        .bottom-space {
            width: 100%;

            height: 55vh;
            height: 55dvh;

            flex-shrink: 0;
        }

        @media (max-width: 700px) {
            #brain-image {
                max-width: 82vw;
            }

            .top-space {
                height: 30vh;
                height: 30dvh;
            }

            .brain-spine-space {
                height: 0;
                margin-bottom: -10dvh;
            }

            .bottom-space {
                height: 52vh;
                height: 52dvh;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            #spine-image {
                opacity: 1;
                transform: none;

                -webkit-mask-image: none;
                mask-image: none;
            }

            #brain-image {
                transition: none;
            }
        }

        #drawings {
            position: relative;

            width: 100%;
            max-width: 900px;
            min-height: 100vh;

            margin: 0 auto;
            overflow: hidden;
        }

        .drawing {
            position: absolute;
            display: block;

            width: auto;
            height: auto;

            object-fit: contain;

            user-select: none;
            -webkit-user-select: none;
            -webkit-user-drag: none;

            opacity: 0;

            /*
            JS에서 각 이미지의 회전값을 여기에 저장
            */
            --drawing-rotation: 0deg;

            transform:
                translateY(12px)
                rotate(var(--drawing-rotation));

            transform-origin: center;

            transition:
                opacity 0.75s ease,
                transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .drawing.visible {
            opacity: 1;

            transform:
                translateY(0)
                rotate(var(--drawing-rotation));
        }

        @media (hover: hover) {
            .drawing:hover {
                z-index: 10;

                transform:
                    translateY(0)
                    rotate(var(--drawing-rotation))
                    scale(1.025);
            }
        }

        .drawing.visible {
            opacity: 1;
        }

        @media (hover: hover) {
            .drawing:hover {
                z-index: 10;
                transform: scale(1.025) !important;
            }
        }
    </style>
</head>

    <script>
        const spineImage =
            document.querySelector("#spine-image");

        const brainImage =

        let revealAnimation = null;

        /*
            새로고침하거나 뒤로 왔을 때
            이전 스크롤 위치가 자동 복원되지 않게 함
        */
        if ("scrollRestoration" in history) {
            history.scrollRestoration = "manual";
        }

        /*
            척추 이미지의 정중앙을
            화면 정중앙에 맞춤
        */
        function centerSpineImage() {
            const imageCenter =
                spineImage.offsetTop +
                spineImage.offsetHeight / 2;

            const targetScroll =
                imageCenter -
                window.innerHeight / 2;

            window.scrollTo({
                top: Math.max(0, targetScroll),
                left: 0,
                behavior: "auto"
            });
        }

       /*
        등장 애니메이션이 끝난 뒤
        남아 있는 위아래 마스크를 제거
       */
       function finishReveal() {
            spineImage.style.opacity = "1";
            spineImage.style.transform = "scale(1)";

        if (revealAnimation) {
            revealAnimation.cancel();
            revealAnimation = null;
            }

        }

        /*
            척추 정중앙에서 위아래로 퍼지며 등장
        */
        function revealSpineImage() {
            centerSpineImage();

            requestAnimationFrame(() => {
                requestAnimationFrame(() => {

                    revealAnimation = spineImage.animate(
                        [
                            {
                                opacity: 0,
                                transform: "scale(0.99)",

                                webkitMaskSize: "100% 2%",
                                maskSize: "100% 2%"
                            },
                            {
                                opacity: 0.2,
                                transform: "scale(0.992)",

                                webkitMaskSize: "100% 20%",
                                maskSize: "100% 20%",

                                offset: 0.16
                            },
                            {
                                opacity: 0.72,
                                transform: "scale(0.998)",

                                webkitMaskSize: "100% 115%",
                                maskSize: "100% 115%",

                                offset: 0.65
                            },
                            {
                                opacity: 1,
                                transform: "scale(1)",

                                webkitMaskSize: "100% 220%",
                                maskSize: "100% 220%"
                            }
                        ],
                        {
                            duration: 4200,

                            easing:
                                "cubic-bezier(0.16, 1, 0.3, 1)",

                            fill: "forwards"
                        }
                    );                   

                    /* 여기부터 추가 */
                    setTimeout(() => {
                        spineImage.style.webkitMaskImage = "none";
                        spineImage.style.maskImage = "none";
                    }, 1000);

                    revealAnimation.addEventListener(
                        "finish",
                        finishReveal,
                        { once: true }
                    );

                });
            });
        }

        /*
            척추 이미지가 완전히 로딩된 후
            위치 계산과 등장 애니메이션 실행
        */
        if (spineImage.complete) {
            revealSpineImage();
        } else {
            spineImage.addEventListener(
                "load",
                revealSpineImage,
                { once: true }
            );
        }

        spineImage.addEventListener(
            "error",
            () => {
                console.error(
                    "images/spine.png 파일을 불러오지 못했습니다."
                );
            },
            { once: true }
        );

        brainImage.addEventListener(

                );

            /*

       const drawingsSection =

        /*

        /*
        새로고침해도 같은 랜덤 배치가 나오게 하는
        고정 랜덤 숫자 생성기
        */
        function createSeededRandom(seed) {
            let value = seed;

            return function random() {
                value |= 0;
                value = value + 0x6D2B79F5 | 0;

                let result = Math.imul(
                    value ^ value >>> 15,
                    1 | value
                );

            result =
                result +
                Math.imul(
                    result ^ result >>> 7,
                    61 | result
                ) ^
                result;

            return (
                (result ^ result >>> 14) >>> 0
            ) / 4294967296;
        };
    }


    function shuffleArray(array, random) {
        const copiedArray = [...array];

        for (
            let index = copiedArray.length - 1;
            index > 0;
            index--
        ) {
            const randomIndex =
                Math.floor(random() * (index + 1));

            [
                copiedArray[index],
                copiedArray[randomIndex]
            ] = [
                copiedArray[randomIndex],
                copiedArray[index]
            ];
        }

        return copiedArray;
    }


    function loadDrawing(fileName) {
        return new Promise((resolve) => {
            const image = new Image();

            image.className = "drawing";
            image.src =
                `images/drawings/${fileName}`;

            image.alt = fileName
                .replace(/\.[^.]+$/, "")
                .replace(/^[HV]\d+_?/, "")
                .replaceAll("_", " ");

            image.draggable = false;

            image.addEventListener(
                "load",
                () => {
                    resolve({
                        fileName,
                        image,
                        ratio:
                            image.naturalWidth /
                            image.naturalHeight
                    });
                },
                { once: true }
            );

            image.addEventListener(
                "error",
                () => {
                    console.error(
                        `이미지를 불러오지 못했습니다: ${fileName}`
                    );

                    resolve(null);
                },
                { once: true }
            );
        });
    }


    /*
    두 이미지가 서로 겹치는지 확인
    */
    function rectanglesOverlap(first, second, gap) {
        return !(
            first.x + first.width + gap <= second.x ||
            second.x + second.width + gap <= first.x ||
            first.y + first.height + gap <= second.y ||
            second.y + second.height + gap <= first.y
        );
    }


    let loadedDrawings = [];
    let resizeTimer = null;


    function arrangeDrawings() {
        if (!loadedDrawings.length) {
            return;
        }

        drawingsSection.innerHTML = "";

        const sectionWidth =
            drawingsSection.clientWidth;

        const isMobile =
            window.innerWidth <= 600;

        const edgePadding =
            isMobile ? 10 : 20;

        const collisionGap =
            isMobile ? 4 : 18;

        /*
        이 숫자를 바꾸면 전체 배치가 달라짐
        */
        const random =
            createSeededRandom(731204);

        const shuffledDrawings =
            shuffleArray(loadedDrawings, random);

        /*
            모바일에서는 행 단위로 배치:
            한 장짜리 행은 절대 연속되지 않음
        */
        if (isMobile) {
            const drawingsToPlace = [...shuffledDrawings];

            let currentY = 20;
            let previousRowCount = 2;

            while (drawingsToPlace.length > 0) {
                /*
                    직전 행이 1장이었다면 이번 행은 무조건 2장.
                    직전 행이 2장이었다면 1장 또는 2장 중 랜덤.
                */
                let rowCount;

                if (previousRowCount === 1) {
                    rowCount = 2;
                } else {
                    rowCount = random() < 0.42 ? 1 : 2;
                }

                rowCount = Math.min(
                    rowCount,
                    drawingsToPlace.length
                );

                let rowDrawings;

                /*
                    1장짜리 행에는 가로 그림만
                */
                if (rowCount === 1) {
                    const horizontalIndex =
                        drawingsToPlace.findIndex(
                            ({ ratio }) => ratio >= 1
                        );

                    if (horizontalIndex !== -1) {
                        rowDrawings = drawingsToPlace.splice(
                            horizontalIndex,
                            1
                        );
                    } else {
                        /*
                            가로 그림이 없으면
                            1장 행을 만들지 않고 2장 행으로 변경
                        */
                        rowCount = Math.min(
                            2,
                            drawingsToPlace.length
                        );
                    }
                }


                /*
                    2장짜리 행:
                    가로+가로 또는 가로+세로만 허용
                */
                if (rowCount === 2) {
                    const firstHorizontalIndex =
                        drawingsToPlace.findIndex(
                            ({ ratio }) => ratio >= 1
                        );

                    /*
                        가로 그림이 하나라도 있으면
                        무조건 첫 번째로 꺼냄
                    */
                    if (firstHorizontalIndex !== -1) {
                        const firstHorizontal =
                            drawingsToPlace.splice(
                                firstHorizontalIndex,
                                1
                            )[0];

                        /*
                            두 번째 그림은 남은 것 중 아무거나
                            → 가로 또는 세로
                        */
                        const verticalIndex =
                            drawingsToPlace.findIndex(
                                ({ ratio }) => ratio < 1
                            );

                        let secondDrawing;

                        if (verticalIndex !== -1) {
                            secondDrawing =
                                drawingsToPlace.splice(
                                    verticalIndex,
                                    1
                                )[0];
                        } else {
                            secondDrawing =
                                drawingsToPlace.splice(0, 1)[0];
                        }

                        rowDrawings = [
                            firstHorizontal,
                            secondDrawing
                        ].filter(Boolean);
                    } else {
                        /*
                            남은 그림이 전부 세로라면
                            세로+세로를 만들지 않기 위해
                            남은 그림을 한 장씩 처리
                        */
                        rowCount = 1;

                        rowDrawings =
                            drawingsToPlace.splice(0, 1);
                    }
                }

                const rowItems = rowDrawings.map(
                    ({ image, ratio }) => {
                        const isHorizontal = ratio >= 1;

                        const width = isHorizontal
                            ? sectionWidth * 0.42
                            : sectionWidth * 0.294;

                        return {
                            image,
                            ratio,
                            width,
                            height: width / ratio
                        };
                    }
                );

                let rowBottom = currentY;

                /*
                    한 장짜리 행
                */
                if (rowCount === 1) {
                    const item = rowItems[0];

                    const maximumX =
                        sectionWidth -
                        item.width -
                        edgePadding;

                    const center =
                        (sectionWidth - item.width) / 2;

                    let x =
                        center +
                        (random() - 0.5) *
                        sectionWidth *
                        0.17;

                    /*
                        혹시라도 화면 밖으로 나가지 않게 제한
                    */
                    x = Math.max(
                        edgePadding,
                        Math.min(maximumX, x)
                    );

                    const rotation =
                        random() < 0.25
                            ? 0
                            : -1.8 + random() * 3.6;

                    item.image.style.width =
                        `${item.width}px`;

                    item.image.style.left =
                        `${x}px`;

                    item.image.style.top =
                        `${currentY}px`;

                    item.image.style.setProperty(
                        "--drawing-rotation",
                        `${rotation}deg`
                    );

                    drawingsSection.appendChild(
                        item.image
                    );

                    rowBottom =
                        currentY + item.height;
                }

                /*
                    두 장짜리 행
                */
                if (rowCount === 2) {
                    const first = rowItems[0];
                    const second = rowItems[1];

                    const sidePadding = edgePadding;

                    /*
                        두 그림을 좌우에 놓되,
                        각 행마다 좌우 위치와 높이를 조금씩 다르게
                    */
                    const firstX =
                        sidePadding +
                        random() *
                        sectionWidth *
                        0.08;

                    const secondX =
                        sectionWidth -
                        second.width -
                        sidePadding -
                        random() *
                        sectionWidth *
                        0.08;

                    /*
                        두 그림 사이 최소 간격
                    */
                    const minimumGap =
                        sectionWidth * 0.045;

                    let adjustedSecondX = secondX;

                    const currentGap =
                        adjustedSecondX -
                        (firstX + first.width);

                    if (currentGap < minimumGap) {
                        adjustedSecondX =
                            firstX +
                            first.width +
                            minimumGap;
                    }

                    /*
                        오른쪽 화면 밖으로 나가지 않게 제한
                    */
                    adjustedSecondX = Math.min(
                        adjustedSecondX,
                        sectionWidth -
                        second.width -
                        sidePadding
                    );

                    /*
                        같은 수평선에 정확히 맞지 않게
                        한쪽을 위아래로 어긋나게 함
                    */
                    const stagger =
                        12 + random() * 38;

                    const firstGoesDown =
                        random() < 0.5;

                    const firstY =
                        currentY +
                        (firstGoesDown ? stagger : 0);

                    const secondY =
                        currentY +
                        (firstGoesDown ? 0 : stagger);

                    [first, second].forEach(
                        (item, index) => {
                            const x =
                                index === 0
                                    ? firstX
                                    : adjustedSecondX;

                            const y =
                                index === 0
                                    ? firstY
                                    : secondY;

                            const rotation =
                                random() < 0.25
                                    ? 0
                                    : -1.8 +
                                    random() * 3.6;

                            item.image.style.width =
                                `${item.width}px`;

                            item.image.style.left =
                                `${x}px`;

                            item.image.style.top =
                                `${y}px`;

                            item.image.style.setProperty(
                                "--drawing-rotation",
                                `${rotation}deg`
                            );

                            drawingsSection.appendChild(
                                item.image
                            );
                        }
                    );

                    rowBottom = Math.max(
                        firstY + first.height,
                        secondY + second.height
                    );
                }

                previousRowCount = rowCount;

                /*
                    다음 행과의 간격도 조금씩 불규칙하게
                    너무 벌어지지 않도록 작은 값 사용
                */
                currentY =
                    rowBottom +
                    12 +
                    random() * 24;
            }

            drawingsSection.style.height =
                `${currentY + 80}px`;

            const drawingObserver =
                new IntersectionObserver(
                    (entries, observer) => {
                        entries.forEach((entry) => {
                            if (!entry.isIntersecting) {
                                return;
                            }

                            entry.target.classList.add(
                                "visible"
                            );

                            observer.unobserve(
                                entry.target
                            );
                        });
                    },
                    {
                        threshold: 0.08,
                        rootMargin: "90px 0px"
                    }
                );

            drawingsSection
                .querySelectorAll(".drawing")
                .forEach((drawing) => {
                    drawingObserver.observe(drawing);
                });

            return;
        }

        const placedRectangles = [];

        /*
        최근 그림들의 가로 중심점을 저장해서
        같은 세로열이 반복되는 것을 방지
        */
        const recentCenters = [];

        let searchY = 30;
        let furthestBottom = 0;


        shuffledDrawings.forEach(
            ({ image, ratio }, drawingIndex) => {

                const isHorizontal =
                    ratio >= 1;

                /*
                모든 종이의 실제 크기가 같아 보이도록
                긴 변 길이를 통일
                */
                let imageWidth;

                if (isMobile) {
                    imageWidth = isHorizontal
                        ? sectionWidth * 0.42
                        : sectionWidth * 0.294;
                } else {
                    imageWidth = isHorizontal
                        ? sectionWidth * 0.28
                        : sectionWidth * 0.196;
                }

                const imageHeight =
                    imageWidth / ratio;

                let position = null;
                let candidateY = searchY;


                /*
                여러 후보 중 첫 번째 빈자리만 쓰지 않고,
                비교적 좋은 위치 후보들을 수집
                */
                for (
                    let verticalStep = 0;
                    verticalStep < 16;
                    verticalStep++
                ) {
                    const candidates = [];

                    for (
                        let attempt = 0;
                        attempt < 40;
                        attempt++
                    ) {
                        const maximumX =
                            Math.max(
                                edgePadding,
                                sectionWidth -
                                imageWidth -
                                edgePadding
                            );

                        const candidateX =
                            edgePadding +
                            random() *
                            Math.max(
                                0,
                                maximumX - edgePadding
                            );

                        const rectangle = {
                            x: candidateX,

                            y:
                                candidateY +
                                random() *
                                (isMobile ? 30 : 100),

                            width: imageWidth,
                            height: imageHeight
                        };

                        const overlaps =
                            placedRectangles.some(
                                (placedRectangle) => {
                                    return rectanglesOverlap(
                                        rectangle,
                                        placedRectangle,
                                        collisionGap
                                    );
                                }
                            );

                        if (overlaps) {
                            continue;
                        }

                        const candidateCenter =
                            rectangle.x +
                            rectangle.width / 2;

                        /*
                        최근 이미지들과 가로 중심이 비슷할수록
                        높은 벌점을 줌
                        */
                        let alignmentPenalty = 0;

                        recentCenters.forEach(
                            (recentCenter, index) => {
                                const distance =
                                    Math.abs(
                                        candidateCenter -
                                        recentCenter
                                    );

                                const minimumDistance =
                                    isMobile
                                        ? sectionWidth * 0.29
                                        : sectionWidth * 0.15;

                                if (distance < minimumDistance) {
                                    /*
                                    가장 최근 그림일수록
                                    더 강하게 피함
                                    */
                                    alignmentPenalty +=
                                        (
                                            minimumDistance -
                                            distance
                                        ) *
                                        (recentCenters.length - index)*
                                        (isMobile ? 4 : 1);
                                }
                            }
                        );

                        /*
                        화면 한가운데로만 몰리는 것도 살짝 방지
                        */
                        const pageCenter =
                            sectionWidth / 2;

                        const centerDistance =
                            Math.abs(
                                candidateCenter -
                                pageCenter
                            );

                        const centerPenalty =
                            centerDistance <
                            sectionWidth * 0.08
                                ? 18
                                : 0;

                        /*
                        완전히 규칙적이지 않도록
                        작은 랜덤값도 점수에 포함
                        */
                        const score =
                            alignmentPenalty +
                            centerPenalty +
                            random() * 20;

                        candidates.push({
                            rectangle,
                            score
                        });
                    }

                    if (candidates.length) {
                        /*
                        점수가 가장 낮은,
                        즉 세로 정렬이 가장 덜한 위치 선택
                        */
                        candidates.sort(
                            (first, second) =>
                                first.score - second.score
                        );

                        position =
                            candidates[0].rectangle;

                        break;
                    }

                    candidateY +=
                        isMobile ? 24 : 65;
                }


                /*
                적당한 빈자리를 찾지 못했을 경우
                현재 최하단 아래에 배치
                */
                if (!position) {
                    const maximumX =
                        Math.max(
                            0,
                            sectionWidth -
                            imageWidth -
                            edgePadding * 2
                        );

                    position = {
                        x:
                            edgePadding +
                            random() * maximumX,

                        y:
                            furthestBottom +
                            collisionGap,

                        width: imageWidth,
                        height: imageHeight
                    };
                }


                placedRectangles.push(position);

                const positionCenter =
                    position.x +
                    position.width / 2;

                recentCenters.push(positionCenter);

                /*
                최근 4장의 가로 위치만 기억
                */
                if (recentCenters.length > 6) {
                    recentCenters.shift();
                }


                furthestBottom =
                    Math.max(
                        furthestBottom,
                        position.y +
                        position.height
                    );

                /*
                너무 넓은 공백 없이
                다음 그림의 탐색 위치를 설정
                */
                searchY =
                    Math.max(
                        20,
                        furthestBottom -
                        (isMobile ? 330 : 350)
                    );


                /*
                일부는 수평,
                나머지는 아주 조금씩만 회전
                */
                let rotation;

                if (drawingIndex % 4 === 0) {
                    rotation = 0;
                } else {
                    rotation =
                        -1.8 + random() * 3.6;
                }


                image.style.width =
                    `${position.width}px`;

                image.style.left =
                    `${position.x}px`;

                image.style.top =
                    `${position.y}px`;

                /*
                transform을 직접 지정하지 않고
                CSS 변수로 회전값 전달
                */
                image.style.setProperty(
                    "--drawing-rotation",
                    `${rotation}deg`
                );

                drawingsSection.appendChild(image);
            }
        );


        drawingsSection.style.height =
            `${furthestBottom + (isMobile ? 100 : 160)}px`;


        /*
        화면에 들어오는 그림만 등장
        */
        const drawingObserver =
            new IntersectionObserver(
                (entries, observer) => {
                    entries.forEach((entry) => {
                        if (!entry.isIntersecting) {
                            return;
                        }

                        entry.target.classList.add(
                            "visible"
                        );

                        observer.unobserve(
                            entry.target
                        );
                    });
                },
                {
                    threshold: 0.08,
                    rootMargin: "90px 0px"
                }
            );

        drawingsSection
            .querySelectorAll(".drawing")
            .forEach((drawing) => {
                drawingObserver.observe(drawing);
            });
    }


    async function initializeDrawings() {
        const loadedResults =
            await Promise.all(
                drawingFiles.map(loadDrawing)
            );

        loadedDrawings =
            loadedResults.filter(Boolean);

        arrangeDrawings();
    }


    initializeDrawings();


    /*
    화면 방향이나 크기가 실제로 크게 바뀐 경우에만
    드로잉을 다시 배치
    */
    window.addEventListener("resize", () => {
        clearTimeout(resizeTimer);

        resizeTimer = setTimeout(() => {
            arrangeDrawings();
        }, 250);
    });

    </script>


</body>

</html>
